<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2140">
<title>道ツアー提案版｜バスツアー会員アプリ</title>
<link rel="stylesheet" href="../../assets/ui.css">
<style>
/* Layout: スマホは1カラム＋下部タブ。PC（960px以上）は左に紺のサイドバー、右に2カラムの本文 */
html,body{min-height:100%}
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr}
.content{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.8rem;padding:.8rem 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:inherit;margin-right:auto}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--font-display);font-weight:600;letter-spacing:.12em;font-size:.98rem}
.demo{font-size:var(--t-xs);font-weight:700;padding:.2rem .65rem;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
main{width:100%;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:.4rem calc(88px + env(safe-area-inset-bottom,0px));display:grid;gap:1rem;align-content:start}
.page-title{display:grid;gap:.3rem;margin-block:.4rem .2rem}
.page-title h1{font-family:var(--font-display);font-weight:600;font-size:var(--t-xl);letter-spacing:.06em}
.grid{display:grid;gap:1rem}
.grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;display:grid;gap:.8rem;align-content:start;min-width:0}
.card h2{font-size:var(--t-md);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.card h2 .link{margin-left:auto;font-size:var(--t-xs);font-weight:600;background:none;border:0;color:var(--blue);cursor:pointer;padding:0}
.ticket-wrap{display:grid;gap:.6rem}
.ticket-wrap p{text-align:center;font-size:var(--t-xs);color:var(--ink-2);letter-spacing:.06em}
.balance{display:flex;align-items:baseline;gap:.35rem}
.balance b{font-family:var(--font-display);font-weight:600;font-size:clamp(2.8rem,9vw,3.6rem);line-height:1;letter-spacing:.01em}
.balance span{font-weight:700;color:var(--ink-2)}
.notice{display:flex;gap:.6rem;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--radius-sm);padding:.65rem .8rem;font-size:var(--t-sm)}
.notice svg{flex:none;width:18px;height:18px;margin-top:.15rem;fill:none;stroke:currentColor;stroke-width:2}
.bal-card{align-self:stretch}
.expiry{display:grid;gap:.1rem;border-top:1px solid var(--line);padding-top:.9rem;margin-top:auto}
.expiry .eyebrow{margin-bottom:.3rem}
.exp-row{display:flex;justify-content:space-between;gap:1rem;font-size:var(--t-sm);padding:.3rem 0}
.expiry .link{justify-self:start;font:inherit;font-size:var(--t-xs);font-weight:600;background:none;border:0;color:var(--blue);cursor:pointer;padding:0;margin-top:.2rem}
.ledger.recent .entry:last-child{border-bottom:0}
/* 招待状（道ツアー） */
.invite{position:relative;border-radius:var(--radius);padding:1.4rem 1.4rem 1.3rem;background:
  linear-gradient(160deg,color-mix(in srgb,var(--brass-soft) 100%,transparent),var(--surface));border:1px solid color-mix(in srgb,var(--brass) 55%,var(--line));display:grid;gap:.75rem}
.invite::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);border-radius:10px;pointer-events:none}
.invite > *{position:relative}
.invite .eyebrow{color:var(--brass)}
.invite h2{font-family:var(--font-display);font-weight:600;font-size:var(--t-xl);letter-spacing:.06em}
.invite .tname{font-family:var(--font-display);font-weight:600;font-size:var(--t-lg);letter-spacing:.04em;line-height:1.5}
.invite dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.6rem;margin:0;border-top:1px dashed color-mix(in srgb,var(--brass) 45%,transparent);padding-top:.8rem}
.invite dt{font-size:var(--t-xs);color:var(--ink-2);letter-spacing:.06em}
.invite dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.invite .state{font-size:var(--t-sm);padding:.6rem .8rem;border-radius:var(--radius-sm);background:var(--surface)}
.invite .actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.goal{display:grid;gap:.6rem}
.goal .dots{display:flex;gap:.4rem}
.goal .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brass)}
.goal .dots i.on{background:var(--brass)}
.chip-proposal{font-size:var(--t-xs);font-weight:700;padding:.2rem .65rem;border-radius:999px;background:var(--brass-soft);color:var(--brass);text-decoration:none;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;font-size:var(--t-sm)}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* 発車案内板：次のツアー */
.board{background:var(--navy);color:var(--on-navy);border-radius:var(--radius);padding:1.2rem 1.3rem;display:grid;gap:.9rem;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);pointer-events:none}
.board .eyebrow{color:#e2cfa9}
.board .dest{font-family:var(--font-display);font-weight:600;font-size:var(--t-lg);letter-spacing:.04em;line-height:1.45}
.board .when{font-family:var(--font-mono);font-size:var(--t-lg);letter-spacing:.08em;color:#f4e3c1}
.board .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;border-top:1px dashed rgba(238,243,251,.2);padding-top:.8rem}
.board .row span{display:block;font-size:var(--t-xs);color:var(--on-navy-2);letter-spacing:.08em}
.board .row b{font-variant-numeric:tabular-nums;font-size:var(--t-md)}
.board .row b.gain{color:#9fe0bf}
.board.empty{background:var(--surface);color:var(--ink-2);border:1px dashed var(--line)}
.board.empty::before{display:none}

/* 台帳（履歴） */
.ledger{display:grid}
.month{font-size:var(--t-xs);font-weight:700;letter-spacing:.16em;color:var(--ink-2);padding:1rem 0 .3rem;border-bottom:1px solid var(--line)}
.month:first-child{padding-top:0}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:.15rem .8rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.entry .ico{grid-row:1 / span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.entry .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.entry.up .ico{background:color-mix(in srgb,var(--plus) 14%,transparent);color:var(--plus)}
.entry .what{min-width:0;overflow-wrap:anywhere;font-size:var(--t-sm);font-weight:600}
.entry .meta{grid-column:2;font-size:var(--t-xs);color:var(--ink-2)}
.entry .pts{grid-row:1 / span 2;grid-column:3;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ツアー一覧 */
.trip{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .date{grid-row:1 / span 3;width:58px;text-align:center;border-radius:10px;background:var(--surface-2);padding:.45rem 0;line-height:1.2;align-self:start}
.trip .date b{display:block;font-family:var(--font-display);font-size:1.45rem;font-weight:600}
.trip .date span{font-size:var(--t-xs);color:var(--ink-2)}
.trip .name{font-weight:700;overflow-wrap:anywhere}
.trip .facts{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:var(--t-sm);color:var(--ink-2)}

table.plain{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.plain td{padding:.55rem 0;border-bottom:1px solid var(--line)}
table.plain td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.how{margin:0;padding-left:1.1rem;display:grid;gap:.4rem;color:var(--ink-2);font-size:var(--t-sm)}
form.stack{display:grid;gap:.8rem}

/* ログイン */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr}
.login .intro{background:var(--navy);color:var(--on-navy);padding:calc(1.4rem + env(safe-area-inset-top,0px)) 16px 4.2rem;display:grid;gap:1.4rem;position:relative;overflow:hidden}
.login .intro::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(120,160,240,.25),transparent 60%),repeating-linear-gradient(118deg,rgba(255,255,255,.025) 0 1px,transparent 1px 9px);pointer-events:none}
.login .intro > *{position:relative}
.login .intro .brand b{color:var(--on-navy)}
.login .intro h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.06em;line-height:1.45}
.login .intro p{color:var(--on-navy-2);font-size:var(--t-sm);max-width:28rem}
.login .intro .ticket{max-width:360px;transform:rotate(-2deg)}
.login .formside{padding:0 16px 2.5rem;margin-top:-2.6rem;display:grid;gap:1rem;align-content:start;justify-items:center}
.login .formside > *{width:100%;max-width:420px}
.samples{display:flex;flex-wrap:wrap;gap:.45rem}
.samples button{font:inherit;font-size:var(--t-sm);font-weight:600;padding:.45rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.samples button:hover{border-color:var(--blue);color:var(--blue)}
.samples small{display:block;font-weight:400;color:var(--ink-2);font-size:var(--t-xs)}

/* ナビ（スマホ：下部タブ／PC：サイドバー） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px}
.navbtn{font:inherit;background:transparent;border:0;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:700;letter-spacing:.04em}
.navbtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--blue)}
.side{display:none}

@media (min-width:960px){
  .app.signed{grid-template-columns:264px 1fr}
  .side{display:flex;flex-direction:column;gap:1.6rem;position:sticky;top:0;height:100vh;background:var(--navy);color:var(--on-navy);padding:1.6rem 1.1rem;overflow:auto}
  .side .brand b{color:var(--on-navy)}
  .side nav{display:grid;gap:.2rem}
  .side .navbtn{flex-direction:row;justify-content:flex-start;gap:.8rem;font-size:var(--t-sm);padding:.7rem .85rem;border-radius:10px;color:var(--on-navy-2);letter-spacing:.06em}
  .side .navbtn:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
  .side .navbtn[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--on-navy);box-shadow:inset 2px 0 0 #e2cfa9}
  .side .who{margin-top:auto;border-top:1px solid rgba(238,243,251,.14);padding-top:1.1rem;display:grid;gap:.25rem;font-size:var(--t-sm)}
  .side .who span{color:var(--on-navy-2);font-size:var(--t-xs)}
  .side .who .mono{font-size:var(--t-xs);color:var(--on-navy-2)}
  .side .links{display:grid;gap:.3rem;font-size:var(--t-xs)}
  .side .links a,.side .links button{color:var(--on-navy-2);background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
  .side .links a:hover,.side .links button:hover{color:var(--on-navy)}
  .tabbar{display:none}
  .appbar{padding-inline:clamp(24px,3vw,48px)}
  .appbar .brand{visibility:hidden}
  main{padding-inline:clamp(24px,3vw,48px);padding-bottom:3rem;gap:1.3rem}
  .page-title h1{font-size:var(--t-2xl)}
  .grid.two{grid-template-columns:1.05fr .95fr;align-items:start}
  .grid.two-even{grid-template-columns:1fr 1fr;align-items:start}
  .login{grid-template-columns:1.1fr .9fr}
  .login .intro{padding:3.5rem clamp(32px,5vw,72px);align-content:center}
  .login .formside{margin:0;padding:3rem clamp(24px,4vw,56px);align-content:center}
  .login .intro .ticket{max-width:400px}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="../../points.js"></script>
<script src="../michi.js"></script>
<script>
"use strict";
// 会員（旅行客）向けアプリ。スタッフ画面と同じブラウザ内のデータを読む。
const SESSION_KEY = "bt-points-michi-member-v1";
const root = document.getElementById("root");
const ui = {tab:"home", memberNo:null, flash:null};

function remember(no){ try { no ? localStorage.setItem(SESSION_KEY, no) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function recall(){ try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } }
function current(){
  if (!ui.memberNo) return null;
  try { const m = getMember(ui.memberNo); return m.status === "active" ? m : null; } catch (e) { return null; }
}
const jp = s => { const [y,m,d] = s.split("-").map(Number); return `${y}年${m}月${d}日`; };
const slash = s => s.replace(/-/g, "/");
const WEEK = "日月火水木金土";
const weekday = s => WEEK[parse(s).getUTCDay()];
const flashHtml = () => ui.flash ? `<div class="toast ${ui.flash[0]}" role="status">${esc(ui.flash[1])}</div>` : "";
const greeting = () => { const h = new Date().getHours(); return h < 5 ? "こんばんは" : h < 11 ? "おはようございます" : h < 18 ? "こんにちは" : "こんばんは"; };

const MARK = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="#c9a76f" stroke-width="1.2"/><path d="M8 19c3-6 7-9 16-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="19" r="2.2" fill="#c9a76f"/><circle cx="24" cy="10" r="2.2" fill="currentColor"/></svg>`;
const ICONS = {
  home:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M15.5 6v12" stroke-dasharray="2 2"/><path d="M6 10h6M6 14h4"/></svg>`,
  history:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>`,
  tours:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="14" rx="3"/><path d="M3.5 11h17M7.5 17.5V20M16.5 17.5V20"/><circle cx="8" cy="14.3" r=".7"/><circle cx="16" cy="14.3" r=".7"/></svg>`,
  info:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>`,
};
const TABS = [["home","会員証"],["history","ポイント履歴"],["tours","ツアー"],["info","ご案内"]];
const TAB_SHORT = {home:"会員証", history:"履歴", tours:"ツアー", info:"ご案内"};
const ENTRY_ICON = {
  up:`<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
  down:`<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>`,
};

function entryHtml(r){
  const b = r.booking_id && db.bookings.find(x => x.id === r.booking_id);
  const tn = b ? getTour(b.tour_id).name : "";
  const title = (r.kind === "earn" || r.kind === "bonus") && tn && !r.reason.includes(tn) ? `${r.reason}／${tn}` : r.reason;
  const upv = r.points > 0;
  return `<div class="entry ${upv ? "up" : ""}"><span class="ico" aria-hidden="true">${upv ? ENTRY_ICON.up : ENTRY_ICON.down}</span>
    <div class="what">${esc(title)}</div><div class="meta">${slash(r.created_on)}・${KIND[r.kind]}</div>
    <div class="pts ${upv ? "plus" : "minus"}">${upv ? "+" : "−"}${yen(Math.abs(r.points))}<span class="small muted"> pt</span></div></div>`;
}

function inviteCard({inv, t}, m){
  const st = inviteState(inv);
  const n = normalToursIn(m.id, today);
  const action = st.code === "booked" ? `<div class="state">ご予約済みです。当日のご参加をお待ちしております。</div>`
    : st.code === "requested" ? `<div class="state">参加のご希望を承りました。スタッフからご連絡いたします。</div>`
    : `<div class="actions"><button type="button" class="btn" data-act="request" data-arg="${inv.id}">参加を希望する</button><span class="small muted">窓口・お電話でも承ります</span></div>`;
  return `<section class="invite" aria-label="道ツアーへのご招待">
    <div class="eyebrow">Invitation</div>
    <h2>道ツアーへのご招待</h2>
    <p class="small">直近1年で通常ツアーに${n}回ご参加いただいた${esc(m.name)}様へ、特別なツアーのご案内です。</p>
    <div class="tname">${esc(t.name)}</div>
    <dl><div><dt>出発日</dt><dd>${slash(t.depart_date)}（${weekday(t.depart_date)}）</dd></div><div><dt>代金</dt><dd>${yen(t.price)}円</dd></div><div><dt>参加特典</dt><dd class="plus">+${yen(t.bonus_points)}pt</dd></div></dl>
    ${action}
  </section>`;
}

function inviteBlock(m){
  const list = myInvites(m.id, today);
  if (list.length) return list.map(x => inviteCard(x, m)).join("");
  const g = inviteGoal(m.id, today);
  const dots = Array.from({length:g.need}, (_, i) => `<i class="${i < g.have ? "on" : ""}"></i>`).join("");
  return `<section class="card goal"><h2>道ツアーへのご招待まで <span class="badge rank-gold plain">招待制</span></h2>
    <div class="dots" aria-hidden="true">${dots}</div>
    <p class="small">${g.left ? `直近1年の通常ツアー参加 <b>${g.have}回</b>。あと<b>${g.left}回</b>のご参加で、道ツアーへの招待が届きます。` : "招待の条件を満たしています。次の道ツアーのご案内をお待ちください。"}</p></section>`;
}

function ticket(m, rank){
  return `<div class="ticket" role="img" aria-label="会員証 ${m.member_no} ${esc(m.name)}様 ${rank.name}">
    <div class="t-main">
      <div><div class="t-brand">バスツアー会員</div><div class="t-label">Member's Pass</div></div>
      <div class="t-no">${m.member_no}</div>
      <div><div class="t-name">${esc(m.name)} 様</div><div class="t-label">Since ${m.joined_on.slice(0,4)}.${m.joined_on.slice(5,7)}</div></div>
    </div>
    <div class="t-stub"><div class="t-label">Class</div><div class="t-class ${rank.code}">${esc(rank.name)}</div><div class="t-mark">×${rank.multiplier}</div></div></div>`;
}

function rankRoute(rank){
  const idx = RULES.RANKS.findIndex(r => r[0] === rank.code);
  const next = RULES.RANKS[idx + 1];
  // 次のランクまでの区間の進み具合を、路線の線の長さで表す
  const frac = next ? (idx + (rank.tours - RULES.RANKS[idx][2]) / (next[2] - RULES.RANKS[idx][2])) / 2 : 1;
  return `<div class="route" role="img" aria-label="直近1年の参加 ${rank.tours}回。現在 ${rank.name}">
    <div class="fill" style="width:calc(66.666% * ${frac.toFixed(3)})"></div>
    ${RULES.RANKS.map((r, i) => `<div class="stop ${i < idx ? "done" : i === idx ? "here" : ""}"><span class="dot"></span><b>${r[1]}</b><span class="muted">${r[2] ? `${r[2]}回〜` : "入会時"}・×${r[3]}</span></div>`).join("")}
  </div>`;
}

const views = {
  home(m){
    const rank = rankFor(m.id, today), bal = balance(m.id, today);
    const soonLimit = addDays(today, 90);
    const soon = expiringSchedule(m.id, today).filter(([d]) => d <= soonLimit);
    const soonPts = soon.reduce((a,[,p]) => a + p, 0);
    const sched = expiringSchedule(m.id, today);
    const recent = db.txns.filter(t => t.member_id === m.id).sort((a,b) => b.id - a.id).slice(0, 4);
    const next = RULES.RANKS.find(r => r[2] > rank.tours);
    const up = db.bookings.filter(b => b.member_id === m.id && b.status === "booked")
      .map(b => ({b, t:getTour(b.tour_id)})).filter(x => x.t.depart_date >= today)
      .sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1)[0];
    let board = `<div class="board empty"><div class="eyebrow" style="color:var(--ink-2)">Next Departure</div><p>参加予定のツアーはありません。ご予約はツアー窓口・お電話で承ります。</p></div>`;
    if (up){
      const {b, t} = up, gain = estimateEarn(m, t, b.price - b.points_used).items.reduce((a,[,p]) => a + p, 0);
      const days = Math.round((parse(t.depart_date) - parse(today)) / 864e5);
      board = `<div class="board" aria-label="次のツアー">
        <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline"><div class="eyebrow">Next Departure</div><span class="small" style="color:var(--on-navy-2)">${days === 0 ? "本日出発" : `出発まで ${days}日`}</span></div>
        <div class="when">${slash(t.depart_date)}（${weekday(t.depart_date)}）</div>
        <div class="dest">${esc(t.name)}</div>
        <div class="row"><div><span>お支払い</span><b>${yen(b.price - b.points_used)}円</b></div><div><span>ポイント利用</span><b>${yen(b.points_used)}pt</b></div><div><span>付与予定</span><b class="gain">+${yen(gain)}pt</b></div></div>
      </div>`;
    }
    return `
    <div class="page-title"><span class="eyebrow">Member's Pass</span><h1>${greeting()}、${esc(m.name)} 様</h1></div>
    ${flashHtml()}
    ${inviteBlock(m)}
    <div class="grid two">
      <div class="ticket-wrap">${ticket(m, rank)}<p>ツアー当日、受付でこの画面をお見せください</p></div>
      <section class="card bal-card" aria-labelledby="bal-h">
        <h2 id="bal-h">保有ポイント</h2>
        <div class="balance"><b class="num">${yen(bal)}</b><span>pt</span></div>
        <p class="small muted">${yen(bal)}円分としてツアー代金に使えます（${RULES.REDEEM_UNIT}pt単位）</p>
        ${soonPts ? `<div class="notice"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span><b>${yen(soonPts)}pt</b> の有効期限が近づいています（${jp(soon[0][0])}まで）</span></div>` : ""}
        <div class="expiry">
          <div class="eyebrow">有効期限</div>
          ${sched.length ? sched.slice(0, 3).map(([d,p]) => `<div class="exp-row"><span>${jp(d)}まで</span><b class="num">${yen(p)}pt</b></div>`).join("") : `<p class="small muted">有効なポイントはありません。</p>`}
          ${sched.length > 3 ? `<button type="button" class="link" data-tab="info">すべて見る</button>` : ""}
        </div>
      </section>
    </div>
    <div class="grid two-even">
      <section class="card" aria-labelledby="rank-h">
        <h2 id="rank-h">会員ランク <span class="badge rank-${rank.code}">${esc(rank.name)}</span></h2>
        ${rankRoute(rank)}
        <p class="small">直近1年の参加 <b>${rank.tours}回</b>${next ? `。あと<b>${next[2] - rank.tours}回</b>で${next[1]}（×${next[3]}）になります。` : "。最上位ランクです。"}</p>
      </section>
      ${board}
    </div>
    <section class="card"><h2>最近のポイント <button type="button" class="link" data-tab="history">履歴をすべて見る</button></h2>
      <div class="ledger recent">${recent.map(entryHtml).join("") || `<p class="muted small">まだありません。</p>`}</div></section>`;
  },

  history(m){
    const rows = db.txns.filter(t => t.member_id === m.id).sort((a,b) => b.id - a.id);
    let body = `<p class="muted">ポイントの履歴はまだありません。</p>`;
    if (rows.length){
      let month = ""; body = "";
      for (const r of rows){
        const mo = r.created_on.slice(0,7);
        if (mo !== month){ month = mo; body += `<div class="month">${mo.slice(0,4)}年${Number(mo.slice(5,7))}月</div>`; }
        body += entryHtml(r);
      }
    }
    const earned = rows.filter(r => r.points > 0).reduce((a,r) => a + r.points, 0);
    const used = rows.filter(r => r.kind === "redeem").reduce((a,r) => a - r.points, 0);
    return `<div class="page-title"><span class="eyebrow">History</span><h1>ポイント履歴</h1></div>
    <div class="grid two" style="grid-template-columns:${innerWidth >= 960 ? "1.6fr .9fr" : "1fr"}">
      <section class="card"><div class="ledger">${body}</div></section>
      <section class="card"><h2>これまでの合計</h2><dl class="kv"><dt>獲得したポイント</dt><dd>+${yen(earned)}pt</dd><dt>ツアー代金に使ったポイント</dt><dd>${yen(used)}pt</dd><dt>現在の保有ポイント</dt><dd><b>${yen(balance(m.id, today))}pt</b></dd></dl></section>
    </div>`;
  },

  tours(m){
    const all = db.bookings.filter(b => b.member_id === m.id).map(b => ({b, t:getTour(b.tour_id)}));
    const upcoming = all.filter(x => x.b.status === "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1);
    const past = all.filter(x => x.b.status !== "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? 1 : -1);
    const trip = ({b, t}) => {
      const earned = db.txns.filter(x => x.booking_id === b.id && (x.kind === "earn" || x.kind === "bonus")).reduce((a,x) => a + x.points, 0);
      const est = b.status === "booked" ? estimateEarn(m, t, b.price - b.points_used).items.reduce((a,[,p]) => a + p, 0) : 0;
      const [y, mo, d] = t.depart_date.split("-").map(Number);
      return `<div class="trip"><div class="date"><span>${y}.${mo}</span><b>${d}</b><span>${weekday(t.depart_date)}曜</span></div>
        <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><span class="badge st-${b.status}">${BOOKING[b.status]}</span>${isMichi(t) ? `<span class="badge rank-gold plain">道ツアー</span>` : ""}</div>
        <div class="name">${esc(t.name)}</div>
        <div class="facts"><span>代金 ${yen(b.price)}円</span>${b.points_used ? `<span>ポイント利用 ${yen(b.points_used)}pt</span>` : ""}
          ${b.status === "completed" ? `<span class="plus">獲得 +${yen(earned)}pt</span>` : ""}${b.status === "booked" ? `<span class="plus">参加で +${yen(est)}pt の予定</span>` : ""}</div></div>`;
    };
    const invites = myInvites(m.id, today);
    return `<div class="page-title"><span class="eyebrow">Tours</span><h1>ツアー</h1></div>
    ${flashHtml()}
    ${invites.map(x => inviteCard(x, m)).join("")}
    <div class="grid two-even">
      <section class="card"><h2>参加予定</h2>${upcoming.map(trip).join("") || `<p class="muted small">参加予定のツアーはありません。ご予約はツアー窓口・お電話で承ります。</p>`}</section>
      <section class="card"><h2>これまでのツアー</h2>${past.map(trip).join("") || `<p class="muted small">まだありません。</p>`}</section>
    </div>`;
  },

  info(m){
    const sched = expiringSchedule(m.id, today);
    return `<div class="page-title"><span class="eyebrow">Guide</span><h1>ご案内</h1></div>
    ${flashHtml()}
    <div class="grid two-even">
      <section class="card"><h2>有効期限ごとのポイント</h2>${
        sched.length ? `<table class="plain">${sched.map(([d,p]) => `<tr><td>${jp(d)}まで</td><td>${yen(p)}pt</td></tr>`).join("")}</table>` : `<p class="muted small">有効なポイントはありません。</p>`}
        <p class="small muted">付与日から${RULES.EXPIRY_YEARS}年後の月末まで有効です。期限の近いものから使われます。</p></section>
      <section class="card"><h2>ポイントのため方</h2><ul class="how">
        <li>ツアー代金${RULES.YEN_PER_POINT}円ごとに1pt × ランク倍率（ツアー終了後に付与）</li>
        <li>お誕生月のツアー参加で +${RULES.BIRTHDAY_BONUS}pt</li>
        <li>ご紹介した方の初参加で +${RULES.REFERRAL_BONUS}pt</li>
        <li>キャンペーン対象ツアーはポイント増量</li></ul>
        <p class="small"><a href="../">ポイント制度のくわしいご案内</a></p></section>
      <section class="card"><h2>暗証番号の変更</h2><form class="stack" data-form="pin">
        <label class="field"><span>現在の暗証番号</span><input class="input" id="p-cur" name="current" type="password" inputmode="numeric" autocomplete="current-password" required></label>
        <label class="field"><span>新しい暗証番号</span><input class="input" id="p-new" name="next" type="password" inputmode="numeric" autocomplete="new-password" required><small>4〜8桁の数字</small></label>
        <button class="btn">変更する</button></form></section>
      <section class="card"><h2>会員情報</h2><dl class="kv"><dt>会員番号</dt><dd class="mono">${m.member_no}</dd><dt>入会日</dt><dd>${jp(m.joined_on)}</dd></dl>
        <p class="small muted">ご登録内容の変更・退会はツアー窓口で承ります。</p>
        <button type="button" class="btn ghost" data-act="logout">ログアウト</button></section>
    </div>`;
  },

  login(){
    const samples = db.members.filter(m => m.status === "active").slice(0, 4);
    return `<div class="login">
      <div class="intro">
        <a class="brand" href="../">${MARK}<b>バスツアー会員</b></a>
        <a class="chip-proposal" href="../" style="justify-self:start">提案版：招待制「道ツアー」入り</a>
        <h1>会員証も、ポイントも、<br>いつでも手のひらに。</h1>
        <p>会員番号と暗証番号でログインすると、保有ポイント、ランク、参加予定のツアーを確かめられます。</p>
        <div class="ticket" role="img" aria-label="会員証の見本"><div class="t-main"><div><div class="t-brand">バスツアー会員</div><div class="t-label">Member's Pass</div></div><div class="t-no">BT00000018</div><div><div class="t-name">会員 見本 様</div><div class="t-label">Sample</div></div></div><div class="t-stub"><div class="t-label">Class</div><div class="t-class regular">会員</div></div></div>
      </div>
      <div class="formside">
        ${flashHtml()}
        <section class="card" style="padding:1.6rem"><h2 style="font-size:var(--t-lg);font-family:var(--font-display);font-weight:600;letter-spacing:.06em">ログイン</h2>
          <form class="stack" data-form="login">
            <label class="field"><span>会員番号</span><input class="input mono" id="l-no" name="member_no" autocomplete="username" autocapitalize="characters" placeholder="BT00000018" required><small>会員証に記載されています</small></label>
            <label class="field"><span>暗証番号</span><input class="input" id="l-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
            <button class="btn block" style="margin-top:.4rem">ログイン</button>
          </form></section>
        <section class="card"><h2>デモ用のサンプル会員</h2><p class="small muted">押すと会員番号と暗証番号が入ります。佐藤様・田中様には道ツアーの招待が届いています。</p>
          <div class="samples">${samples.map(m => { const r = rankFor(m.id, today); return `<button type="button" data-fill="${m.member_no}" data-pin="${esc(m.pin)}">${esc(m.name)}<small>${r.name}・${yen(balance(m.id, today))}pt</small></button>`; }).join("")}</div></section>
        <p class="small muted" style="text-align:center"><a href="../admin/">スタッフ画面</a>で予約やポイント付与をすると、同じブラウザならこの画面に反映されます。</p>
      </div>
    </div>`;
  },
};

function render(){
  const m = current();
  if (!m){ ui.memberNo = null; remember(null); }
  if (!m){ root.innerHTML = views.login(); ui.flash = null; document.title = "ログイン｜バスツアー会員アプリ"; return; }
  const navBtns = compact => TABS.map(([k,l]) => `<button type="button" class="navbtn" data-tab="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>${ICONS[k]}<span>${compact ? TAB_SHORT[k] : l}</span></button>`).join("");
  root.innerHTML = `<div class="app signed">
    <aside class="side" aria-label="メニュー">
      <a class="brand" href="../">${MARK}<b>バスツアー会員</b></a>
      <nav>${navBtns(false)}</nav>
      <div class="who"><span>ログイン中</span><b>${esc(m.name)} 様</b><span class="mono">${m.member_no}</span></div>
      <div class="links"><a href="../">制度のご案内</a><a href="../admin/">スタッフ画面（デモ）</a><a href="../../member/">現行版の会員アプリ</a><button type="button" data-act="logout">ログアウト</button></div>
    </aside>
    <div class="content">
      <header class="appbar"><a class="brand" href="../">${MARK}<b>バスツアー会員</b></a><a class="chip-proposal" href="../" title="道ツアーを組み込んだ提案版です">提案版</a><span class="demo" title="デモの日付">デモ ${slash(today)}</span></header>
      <main id="main">${views[ui.tab](m)}</main>
    </div>
  </div>
  <nav class="tabbar" aria-label="メニュー"><div class="tabs">${navBtns(true)}</div></nav>`;
  document.title = `${TABS.find(t => t[0] === ui.tab)[1]}｜バスツアー会員アプリ`;
  ui.flash = null;
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const fill = e.target.closest("[data-fill]");
  if (fill){ document.getElementById("l-no").value = fill.dataset.fill; document.getElementById("l-pin").value = fill.dataset.pin; document.getElementById("l-pin").focus(); return; }
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "request"){
    try { requestJoin(Number(act.dataset.arg), today); ui.flash = ["ok","参加のご希望を承りました。スタッフからご連絡いたします"]; }
    catch (err){ if (!(err instanceof PointError)) throw err; ui.flash = ["err", err.message]; }
    render(); return;
  }
  if (act && act.dataset.act === "logout"){ ui.memberNo = null; remember(null); ui.tab = "home"; ui.flash = ["ok","ログアウトしました"]; render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "login"){
    const m = authenticate(v.member_no, v.pin);
    if (!m){ ui.flash = ["err","会員番号または暗証番号が正しくありません"]; render(); return; }
    ui.memberNo = m.member_no; remember(m.member_no); ui.tab = "home"; render();
  } else if (f.dataset.form === "pin"){
    const m = current();
    if (m.pin !== v.current) ui.flash = ["err","現在の暗証番号が正しくありません"];
    else if (!/^\d{4,8}$/.test(v.next || "")) ui.flash = ["err","暗証番号は4〜8桁の数字で設定してください"];
    else { m.pin = v.next; save(); ui.flash = ["ok","暗証番号を変更しました"]; }
    render();
  }
});

// スタッフ画面（別タブ）での変更をすぐ反映する
window.addEventListener("storage", e => { if (e.key === MICHI_KEY){ bootData(); render(); } });
let lastWide = innerWidth >= 960;
window.addEventListener("resize", () => { const w = innerWidth >= 960; if (w !== lastWide){ lastWide = w; render(); } });

bootData();
ui.memberNo = recall();
render();
</script>
<script src="../../assets/viewswitch.js"></script>
</body>
</html>
