<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6a4b">
<title>スタッフ画面｜バスツアー会員ポイント</title>
<link rel="stylesheet" href="../assets/ui.css">
<style>
/* Layout: 上に緑の帯（システム名とデモ操作）、PC は左に白いメニュー、右に作業領域。スマホはメニューを横並び */
.topbar{background:var(--bar);color:var(--on-bar);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.5rem 16px;padding-top:calc(.5rem + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20}
.topbar .brand{color:inherit;text-decoration:none;font-weight:700;margin-right:auto}
.topbar .brand small{font-weight:400;margin-left:.5rem;opacity:.85}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;font-size:var(--t-xs)}
.demo b{background:var(--warn-bg);color:var(--warn-ink);padding:0 .4rem;border-radius:var(--radius-sm)}
.demo input{font:inherit;font-size:var(--t-xs);padding:.15rem .3rem;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
.demo button{font:inherit;font-size:var(--t-xs);padding:.15rem .5rem;border:1px solid rgba(255,255,255,.7);border-radius:var(--radius-sm);background:transparent;color:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 44px)}
.side{background:var(--surface);border-bottom:1px solid var(--line)}
.menu{display:flex;overflow-x:auto;scrollbar-width:none}
.menu button{font:inherit;font-size:var(--t-sm);font-weight:700;display:flex;align-items:center;gap:.5rem;padding:.65rem 1rem;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--surface-2)}
.menu button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.menu svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .links{display:none}
.work{min-width:0;padding:1rem 16px 4rem;display:grid;gap:1rem;align-content:start;max-width:1200px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6rem 1rem;justify-content:space-between;border-bottom:2px solid var(--brand);padding-bottom:.4rem}
.head h1{font-size:var(--t-xl)}
.head .actions{display:flex;gap:.5rem;flex-wrap:wrap}
.back{font:inherit;font-size:var(--t-sm);color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.grid{display:grid;gap:1rem}
.grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;display:grid;gap:.8rem;align-content:start;min-width:0}
.card h2{font-size:var(--t-md);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-left:4px solid var(--brand);padding-left:.55rem;line-height:1.3}
.card h2 .muted{font-weight:400;font-size:var(--t-sm)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}
.kpi{padding:.7rem 1rem;display:grid;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{font-size:var(--t-xs);color:var(--ink-2);font-weight:700}
.kpi b{font-size:1.5rem;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.55em;margin-left:.15em}
.kpi em{font-style:normal;font-size:var(--t-xs);color:var(--ink-2)}
.kpi.warn b{color:var(--minus)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:560px}
table.t th{font-size:var(--t-xs);color:var(--ink-2);text-align:left;padding:.45rem .6rem;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
table.t td{padding:.5rem .6rem;border:1px solid var(--line);vertical-align:middle}
table.t tbody tr:hover{background:var(--surface-2)}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .nowrap{white-space:nowrap}
.linkish{font:inherit;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-align:left}
.sub{display:block;font-size:var(--t-xs);color:var(--ink-2);font-weight:400}
.search{display:flex;gap:.5rem}
.search .input{max-width:420px}
.depart{display:grid}
.depart button{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:.55rem 0;display:grid;grid-template-columns:7.5em 1fr auto;gap:.6rem;align-items:baseline;text-align:left;cursor:pointer}
.depart button:last-child{border-bottom:0}
.depart button:hover .nm{text-decoration:underline}
.depart .d{font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
.depart .nm{font-weight:700;font-size:var(--t-sm);color:var(--link)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1.2rem}
.form-grid .full{grid-column:1 / -1}
.form-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.hint{font-size:var(--t-sm);padding:.55rem .8rem;border-radius:var(--radius-sm);background:var(--brand-soft);border:1px solid var(--brand)}
.hint.bad{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.profile{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:1.4rem;align-items:start}
.bal{display:flex;align-items:baseline;gap:.3rem}
.bal b{font-size:2.2rem;line-height:1.2;color:var(--accent)}
.bal span{font-weight:700}
.lbl{font-size:var(--t-xs);color:var(--ink-2);font-weight:700}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.2rem;margin:0;font-size:var(--t-sm)}
dl.kv dt{color:var(--ink-2)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.facts-row{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;font-size:var(--t-sm);color:var(--ink-2)}
.facts-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.danger-zone{border-color:var(--minus)}
.danger-zone h2{border-left-color:var(--minus)}

@media (min-width:960px){
  .shell{grid-template-columns:220px 1fr}
  .side{border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
  .menu{flex-direction:column;overflow:visible}
  .menu button{border-right:0;border-bottom:1px solid var(--line);padding:.75rem 1rem}
  .menu button[aria-current="page"]{box-shadow:inset 4px 0 0 var(--brand)}
  .side .links{display:grid;gap:.25rem;font-size:var(--t-xs);padding:1rem}
  .work{padding:1.25rem 24px 4rem}
  .two{grid-template-columns:1.6fr 1fr}
  .two-even{grid-template-columns:1fr 1fr}
}
@media (max-width:959px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi:nth-child(3){border-left:0} .kpi:nth-child(n+3){border-top:1px solid var(--line)} .profile{grid-template-columns:1fr} }
@media (max-width:560px){ table.t.members{min-width:0} table.t.members :is(th,td):nth-child(3),table.t.members :is(th,td):nth-child(5){display:none} .form-grid{grid-template-columns:1fr} .search{flex-direction:column} }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../">バスツアー会員<small>スタッフ画面</small></a>
  <div class="demo" aria-label="デモの操作"><b>デモ</b><label>日付 <input type="date" id="demo-date"></label><button type="button" data-act="reset">サンプルデータに戻す</button></div>
</header>
<div class="shell">
  <aside class="side">
    <nav class="menu" aria-label="スタッフメニュー" id="menu"></nav>
    <div class="links"><a href="../">制度のご案内（トップ）</a><a href="../member/">会員ページ</a><span class="muted">データはこのブラウザの中だけに保存されます。実在の個人情報は入力しないでください。</span></div>
  </aside>
  <main class="work" id="app"></main>
</div>

<script src="../points.js"></script>
<script>
"use strict";
const app = document.getElementById("app");
const ui = {view:"home", param:null, flash:null, query:"", check:"", confirm:null};
const OP = "デモ担当";
const ICON = {
  home:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>`,
  tours:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="14" rx="3"/><path d="M3.5 11h17M7.5 17.5V20M16.5 17.5V20"/></svg>`,
  newMember:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M18 7v6M15 10h6"/></svg>`,
};
const MENU = [["home","ホーム"],["tours","ツアー"],["newMember","新規入会"]];
const WEEK = "日月火水木金土";
const slash = s => s.replace(/-/g, "/");

function go(view, param = null, flash = null){ Object.assign(ui, {view, param, flash, confirm:null}); render(); window.scrollTo(0,0); }
const badge = (cls, text) => `<span class="badge ${cls}">${esc(text)}</span>`;
const rankBadge = r => badge("rank-" + r.code, r.name);
const memberBtn = m => `<button type="button" class="linkish mono" data-go="member" data-arg="${m.member_no}">${m.member_no}</button>`;
const head = (title, actions = "", back = "") =>
  `${back ? `<div>${back}</div>` : ""}<div class="head"><h1>${esc(title)}</h1>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
const dateBlock = d => { const [, mo, day] = d.split("-").map(Number); return `<span class="d">${mo}/${day}（${WEEK[parse(d).getUTCDay()]}）</span>`; };

function cancelBtn(b){
  if (b.status !== "booked") return "";
  const key = "cancel-" + b.id;
  return ui.confirm === key
    ? `<span class="nowrap"><button type="button" class="btn sm danger" data-act="cancel-booking" data-arg="${b.id}">取消を確定</button> <button type="button" class="btn sm ghost" data-act="confirm" data-arg="">やめる</button></span>`
    : `<button type="button" class="btn sm ghost" data-act="confirm" data-arg="${key}">取消</button>`;
}

function ticket(m, rank){
  return `<div class="ticket" role="img" aria-label="会員証 ${m.member_no}">
    <div class="t-head"><span>バスツアー会員証</span><span>${esc(rank.name)}</span></div>
    <div class="t-body"><div class="t-no">${m.member_no}</div><div class="t-name">${esc(m.name)} 様</div>
      <dl><div><dt>入会</dt><dd>${m.joined_on.slice(0,4)}年${Number(m.joined_on.slice(5,7))}月</dd></div><div><dt>ポイント倍率</dt><dd>${rank.multiplier}倍</dd></div></dl></div></div>`;
}

function historyTable(mid){
  const rows = db.txns.filter(t => t.member_id === mid).sort((a,b) => b.id - a.id);
  if (!rows.length) return `<p class="muted small">履歴はまだありません。</p>`;
  return `<div class="tablewrap"><table class="t"><thead><tr><th>日付</th><th>区分</th><th>内容</th><th>担当</th><th class="r">ポイント</th></tr></thead><tbody>${
    rows.map(r => {
      let reason = r.reason;
      const b = r.booking_id && db.bookings.find(b => b.id === r.booking_id);
      const tn = b && getTour(b.tour_id).name;
      if (tn && (r.kind === "earn" || r.kind === "bonus") && !reason.includes(tn)) reason += `／${tn}`;
      return `<tr><td class="nowrap num">${slash(r.created_on)}</td><td>${badge("plain", KIND[r.kind])}</td><td>${esc(reason)}</td><td class="muted nowrap">${esc(r.operator || "-")}</td><td class="r ${r.points > 0 ? "plus" : "minus"}"><b>${r.points > 0 ? "+" : "−"}${yen(Math.abs(r.points))}</b></td></tr>`;
    }).join("")}</tbody></table></div>`;
}

const views = {
  home(){
    const soon = addDays(today, 90);
    const active = db.members.filter(m => m.status === "active");
    const outstanding = db.lots.filter(l => l.expires_on >= today).reduce((a,l) => a + l.remaining, 0);
    const expiring = db.lots.filter(l => l.expires_on >= today && l.expires_on <= soon).reduce((a,l) => a + l.remaining, 0);
    const scheduled = db.tours.filter(t => t.status === "scheduled").sort((a,b) => a.depart_date < b.depart_date ? -1 : 1);
    const q = ui.query.trim();
    const list = (q ? db.members.filter(m => [m.member_no,m.name,m.kana,m.phone,m.email].some(v => (v || "").includes(q))) : db.members)
      .slice().sort((a,b) => b.id - a.id).slice(0, 50);
    return `${head("ホーム", `<button type="button" class="btn" data-go="newMember">＋ 新規入会</button>`)}
    ${flashHtml()}
    <div class="kpis">
      <div class="kpi"><span>未使用ポイント残高</span><b class="num">${yen(outstanding)}<small>pt</small></b><em>${yen(outstanding)}円相当の値引き予定</em></div>
      <div class="kpi"><span>有効会員数</span><b class="num">${yen(active.length)}<small>名</small></b><em>退会者を除く</em></div>
      <div class="kpi ${expiring ? "warn" : ""}"><span>90日以内に失効予定</span><b class="num">${yen(expiring)}<small>pt</small></b><em>${slash(soon)} まで</em></div>
      <div class="kpi"><span>催行予定ツアー</span><b class="num">${scheduled.length}<small>件</small></b><em>${scheduled[0] ? `次の出発 ${slash(scheduled[0].depart_date)}` : "予定なし"}</em></div>
    </div>
    <div class="grid two">
      <section class="card"><h2>会員 <span class="muted">${q ? `「${esc(q)}」の検索結果 ${list.length}件` : `最近入会した順`}</span></h2>
        <form data-form="search" class="search" role="search"><input class="input" id="q" name="q" value="${esc(ui.query)}" placeholder="会員番号・氏名・カナ・電話で検索" aria-label="会員を検索"><button class="btn ghost">検索</button></form>
        <div class="tablewrap"><table class="t members"><thead><tr><th>会員番号</th><th>氏名</th><th>ランク</th><th class="r">残高</th><th>状態</th></tr></thead><tbody>${
          list.map(m => `<tr><td>${memberBtn(m)}</td><td>${esc(m.name)}<span class="sub">${esc(m.kana)}</span></td><td>${rankBadge(rankFor(m.id, today))}</td><td class="r"><b>${yen(balance(m.id, today))}</b> pt</td><td>${m.status === "active" ? badge("st-booked","有効") : badge("st-cancelled","退会")}</td></tr>`).join("")
          || `<tr><td colspan="5" class="muted">該当する会員はいません</td></tr>`}</tbody></table></div>
      </section>
      <div class="grid" style="gap:1.2rem">
        <section class="card"><h2>次の出発</h2><div class="depart">${
          scheduled.slice(0, 4).map(t => { const n = db.bookings.filter(b => b.tour_id === t.id && b.status === "booked").length;
            return `<button type="button" data-go="tour" data-arg="${t.id}">${dateBlock(t.depart_date)}<span><span class="nm">${esc(t.name)}</span><span class="sub">${yen(t.price)}円${t.bonus_multiplier !== 1 ? `・ポイント×${t.bonus_multiplier}` : ""}${t.bonus_points ? `・+${t.bonus_points}pt` : ""}</span></span><span class="small muted nowrap">${n}名</span></button>`; }).join("")
          || `<p class="muted small">催行予定のツアーはありません。</p>`}</div></section>
        <section class="card"><h2>期限切れポイントの失効処理</h2><p class="small muted">残高の表示では期限切れを自動で除いています。台帳に失効の記録を残すため、定期的に実行してください。</p>
          <div><button type="button" class="btn ghost" data-act="expire">失効処理を実行</button></div></section>
      </div>
    </div>`;
  },

  member(){
    const m = getMember(ui.param);
    const rank = rankFor(m.id, today), bal = balance(m.id, today);
    const next = RULES.RANKS.find(r => r[2] > rank.tours);
    const sched = expiringSchedule(m.id, today);
    const ref = m.referrer_id ? memberById(m.referrer_id) : null;
    const bookings = db.bookings.filter(b => b.member_id === m.id).map(b => ({b, t:getTour(b.tour_id)}))
      .sort((x,y) => x.t.depart_date < y.t.depart_date ? 1 : -1);
    const tools = m.status !== "active" ? "" : `<div class="grid two-even">
      <section class="card"><h2>ポイント調整</h2><form data-form="adjust" class="form-grid">
        <label class="field"><span>ポイント</span><input class="input num" id="adj-points" name="points" inputmode="numeric" required placeholder="例: 200 / -100"><small>減らすときはマイナス</small></label>
        <label class="field"><span>理由</span><input class="input" id="adj-reason" name="reason" required placeholder="例: 付与漏れの訂正"><small>履歴に残ります</small></label>
        <div class="form-actions full"><button class="btn">調整する</button></div></form></section>
      <section class="card danger-zone"><h2>退会</h2><form data-form="withdraw" style="display:grid;gap:.8rem">
        <p class="small muted">退会すると保有ポイント ${yen(bal)}pt はすべて失効します。参加予定のツアーがある場合は先に取り消してください。</p>
        <label class="check"><input type="checkbox" name="confirm" id="wd-confirm"> 保有ポイントが失効することをお客様に説明済み</label>
        <div><button class="btn danger">退会処理</button></div></form></section></div>`;
    return `${head(m.name + " 様", "", `<button type="button" class="back" data-go="home">← ホームに戻る</button>`)}
    ${flashHtml()}
    <section class="card"><div class="profile">
      <div>${ticket(m, rank)}</div>
      <div class="grid" style="gap:1rem">
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">${rankBadge(rank)}${m.status === "active" ? "" : badge("st-cancelled","退会済")}<span class="small muted">直近1年の参加 ${rank.tours}回${next ? `・あと${next[2] - rank.tours}回で${next[1]}` : "・最上位ランク"}</span></div>
        <div><div class="lbl">保有ポイント</div><div class="bal"><b class="num">${yen(bal)}</b><span>pt</span></div></div>
        <div class="facts-row">${sched.length ? sched.map(([d,p]) => `<span>${slash(d)} まで <b>${yen(p)}pt</b></span>`).join("") : `<span>有効なポイントはありません</span>`}</div>
      </div></div></section>
    <div class="grid two">
      <section class="card"><h2>ツアー</h2>${bookings.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>出発日</th><th>ツアー</th><th class="r">代金</th><th class="r">利用pt</th><th>状態</th><th></th></tr></thead><tbody>${
        bookings.map(({b,t}) => `<tr><td class="nowrap num">${slash(t.depart_date)}</td><td><button type="button" class="linkish" data-go="tour" data-arg="${t.id}">${esc(t.name)}</button></td><td class="r">${yen(b.price)}</td><td class="r">${yen(b.points_used)}</td><td>${badge("st-"+b.status, BOOKING[b.status])}</td><td class="r">${cancelBtn(b)}</td></tr>`).join("")
      }</tbody></table></div>` : `<p class="muted small">ツアーの予約・参加はまだありません。</p>`}</section>
      <section class="card"><h2>登録情報</h2><dl class="kv">
        <dt>フリガナ</dt><dd>${esc(m.kana) || "-"}</dd><dt>電話</dt><dd>${esc(m.phone) || "-"}</dd><dt>メール</dt><dd>${esc(m.email) || "-"}</dd>
        <dt>生年月日</dt><dd>${m.birthdate ? slash(m.birthdate) : "-"}</dd><dt>入会日</dt><dd>${slash(m.joined_on)}</dd>
        ${ref ? `<dt>紹介者</dt><dd>${memberBtn(ref)} ${esc(ref.name)}</dd>` : ""}</dl></section>
    </div>
    <section class="card"><h2>ポイント履歴</h2>${historyTable(m.id)}</section>
    ${tools}`;
  },

  newMember(){
    return `${head("新規入会")}
    ${flashHtml()}
    <section class="card" style="max-width:860px"><form data-form="register" class="form-grid">
      <label class="field"><span>氏名（必須）</span><input class="input" id="r-name" name="name" required value="高橋 美咲"></label>
      <label class="field"><span>フリガナ</span><input class="input" id="r-kana" name="kana" value="タカハシ ミサキ"></label>
      <label class="field"><span>電話番号</span><input class="input" id="r-phone" name="phone" inputmode="tel" value="090-0000-1111"></label>
      <label class="field"><span>メールアドレス</span><input class="input" id="r-email" name="email" type="email"></label>
      <label class="field"><span>生年月日</span><input class="input" id="r-birth" name="birthdate" type="date" value="1962-${today.slice(5,7)}-08"><small>誕生月特典に使います</small></label>
      <label class="field"><span>紹介者の会員番号（任意）</span><input class="input mono" id="r-ref" name="referrer_no" placeholder="${db.members[0] ? db.members[0].member_no : "BT00000018"}"></label>
      <label class="field"><span>会員ページの暗証番号（必須）</span><input class="input" id="r-pin" name="pin" inputmode="numeric" required value="1111"><small>4〜8桁の数字。お客様に決めていただきます</small></label>
      <div class="field"><span>入会特典</span><p class="small muted" style="padding-top:.5rem">登録すると ${RULES.WELCOME_BONUS}pt が付き、会員番号が発行されます。</p></div>
      <div class="form-actions full"><button class="btn">入会登録</button><span class="small muted">入力欄にはサンプルの値が入っています</span></div>
    </form></section>`;
  },

  tours(){
    const rows = db.tours.slice().sort((a,b) => a.depart_date < b.depart_date ? 1 : -1).map(t => {
      const n = db.bookings.filter(b => b.tour_id === t.id && b.status !== "cancelled").length;
      const camp = [t.bonus_multiplier !== 1 ? `ポイント×${t.bonus_multiplier}` : "", t.bonus_points ? `+${t.bonus_points}pt` : ""].filter(Boolean).join("・");
      const st = t.status === "scheduled" ? "st-booked" : t.status === "completed" ? "st-completed" : "st-cancelled";
      return `<tr><td class="nowrap num">${slash(t.depart_date)}（${WEEK[parse(t.depart_date).getUTCDay()]}）</td><td><button type="button" class="linkish" data-go="tour" data-arg="${t.id}">${esc(t.name)}</button><span class="sub mono">${esc(t.code)}</span></td><td class="r">${yen(t.price)}円</td><td>${camp ? badge("rank-gold plain", camp) : `<span class="muted">-</span>`}</td><td class="r">${n}名</td><td>${badge(st, TOUR[t.status])}</td></tr>`;
    }).join("");
    return `${head("ツアー")}
    ${flashHtml()}
    <section class="card"><div class="tablewrap"><table class="t"><thead><tr><th>出発日</th><th>ツアー</th><th class="r">代金</th><th>キャンペーン</th><th class="r">人数</th><th>状態</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="card"><h2>ツアーを登録する</h2><form data-form="tour" class="form-grid">
      <label class="field"><span>ツアーコード</span><input class="input mono" id="t-code" name="code" required value="2026-${String(db.seq.tour+1).padStart(2,"0")}-NEW"></label>
      <label class="field"><span>ツアー名</span><input class="input" id="t-name" name="name" required value="ぶどう狩りと甲府ワイナリー見学"></label>
      <label class="field"><span>出発日</span><input class="input" id="t-date" name="depart_date" type="date" required value="${addDays(today, 25)}"></label>
      <label class="field"><span>代金（税込・1名）</span><input class="input num" id="t-price" name="price" inputmode="numeric" required value="10800"></label>
      <label class="field"><span>キャンペーン倍率</span><input class="input num" id="t-mult" name="bonus_multiplier" value="1"><small>通常は 1。2 にするとポイント2倍</small></label>
      <label class="field"><span>キャンペーン加算ポイント</span><input class="input num" id="t-bonus" name="bonus_points" value="0" inputmode="numeric"><small>通常は 0</small></label>
      <div class="form-actions full"><button class="btn">登録する</button></div></form></section>`;
  },

  tour(){
    const t = getTour(ui.param), open = t.status === "scheduled";
    const bookings = db.bookings.filter(b => b.tour_id === t.id);
    const rows = bookings.map(b => {
      const m = memberById(b.member_id);
      let est = `<span class="muted">-</span>`;
      if (b.status === "booked"){ const e = estimateEarn(m, t, b.price - b.points_used); est = `<b class="plus">+${yen(e.items.reduce((a,[,p]) => a + p, 0))}</b> <span class="sub" style="display:inline">${e.rank.name}</span>`; }
      return `<tr><td>${memberBtn(m)}</td><td>${esc(m.name)}</td><td class="r">${yen(b.points_used)}</td><td class="r">${yen(b.price - b.points_used)}円</td><td class="r nowrap">${est}</td><td>${badge("st-"+b.status, BOOKING[b.status])}</td><td class="r">${open ? cancelBtn(b) : ""}</td></tr>`;
    }).join("");
    const camp = [t.bonus_multiplier !== 1 ? `ポイント×${t.bonus_multiplier}` : "", t.bonus_points ? `+${t.bonus_points}pt` : ""].filter(Boolean).join("・");
    let hint = "", checked = null;
    if (ui.check){
      try { checked = getMember(ui.check);
        hint = `<div class="hint"><b>${esc(checked.name)} 様</b>　残高 <b>${yen(balance(checked.id, today))}pt</b> ／ このツアーで使えるのは最大 <b>${yen(maxRedeemable(checked.id, t.price, today))}pt</b></div>`;
      } catch (e) { hint = `<div class="hint bad">${esc(e.message)}</div>`; }
    }
    const booked = bookings.filter(b => b.status === "booked");
    const sample = db.members.find(m => m.status === "active" && !bookings.some(b => b.member_id === m.id && b.status !== "cancelled"));
    const st = t.status === "scheduled" ? "st-booked" : t.status === "completed" ? "st-completed" : "st-cancelled";
    return `${head(t.name, "", `<button type="button" class="back" data-go="tours">← ツアー一覧に戻る</button>`)}
    ${flashHtml()}
    <section class="card"><div class="facts-row" style="font-size:var(--t-md)">
      <span>${badge(st, TOUR[t.status])}</span><span>出発日 <b>${slash(t.depart_date)}（${WEEK[parse(t.depart_date).getUTCDay()]}）</b></span><span>代金 <b>${yen(t.price)}円</b></span><span>コード <b class="mono">${esc(t.code)}</b></span>${camp ? `<span>キャンペーン <b>${camp}</b></span>` : ""}
    </div></section>
    <section class="card"><h2>予約者 <span class="muted">${bookings.filter(b => b.status !== "cancelled").length}名</span></h2>${rows ? `<div class="tablewrap"><table class="t"><thead><tr><th>会員番号</th><th>氏名</th><th class="r">利用pt</th><th class="r">支払額</th><th class="r">付与予定</th><th>状態</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="muted small">予約はまだありません。</p>`}</section>
    ${open ? `
    <div class="grid two-even">
      <section class="card"><h2>予約を登録する</h2>
        <form data-form="check" class="search"><input class="input mono" id="chk" name="member_no" value="${esc(ui.check)}" placeholder="会員番号（例: ${sample ? sample.member_no : "BT00000018"}）" aria-label="会員番号"><button class="btn ghost">残高を確認</button></form>
        ${hint}
        <form data-form="book" class="search"><input class="input num" id="bk-pts" name="points" value="0" inputmode="numeric" aria-label="利用ポイント" ${checked ? "" : "disabled"}><button class="btn" ${checked ? "" : "disabled"}>予約を登録</button></form>
        <p class="small muted">${checked ? `使うポイントを ${RULES.REDEEM_UNIT}pt 単位で入力してください（使わない場合は 0）。` : "先に会員番号を入れて「残高を確認」を押してください。"}</p>
      </section>
      <section class="card"><h2>催行完了・ポイント付与</h2><form data-form="complete" style="display:grid;gap:.6rem">
        ${booked.map(b => `<label class="check"><input type="checkbox" name="absent" value="${b.id}"> ${esc(memberById(b.member_id).name)} 様は当日不参加</label>`).join("") || `<p class="muted small">参加予定の方はいません。</p>`}
        <div><button class="btn" ${t.depart_date > today ? "disabled" : ""}>催行完了として付与</button></div></form>
        <p class="small muted">${t.depart_date > today ? `出発日（${slash(t.depart_date)}）以降に実行できます。画面上部の「デモ 日付」を出発日以降にすると試せます。` : "不参加の方には付与されず、使ったポイントも戻りません。"}</p></section>
    </div>
    <section class="card danger-zone"><h2>催行中止</h2><form data-form="cancel-tour" style="display:grid;gap:.8rem">
      <label class="check"><input type="checkbox" name="confirm" id="ct-confirm"> 全員の予約を取り消し、使ったポイントをお戻しする</label>
      <div><button class="btn danger">ツアーを中止する</button></div></form></section>` : ""}`;
  },
};

const flashHtml = () => ui.flash ? `<div class="toast ${ui.flash[0]}" role="status">${esc(ui.flash[1])}</div>` : "";

function render(){
  const cur = ui.view === "member" ? "home" : ui.view === "tour" ? "tours" : ui.view;
  document.getElementById("menu").innerHTML = MENU.map(([v,l]) => `<button type="button" data-go="${v}" ${cur === v ? 'aria-current="page"' : ""}>${ICON[v]}${l}</button>`).join("");
  document.getElementById("demo-date").value = today;
  let html = "";
  try { html += views[ui.view](); }
  catch (e) { if (!(e instanceof PointError)) throw e; html += `<div class="toast err">${esc(e.message)}</div>`; }
  app.innerHTML = html;
  ui.flash = null;
}

function run(fn){
  try { fn(); }
  catch (e) { if (!(e instanceof PointError)) throw e; ui.flash = ["err", e.message]; ui.confirm = null; render(); }
}
const num = v => { const s = String(v ?? "").replace(/[,，\s]/g, ""); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; };
function setDate(v){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  today = v; save(); ui.flash = ["ok", `デモの日付を ${slash(today)} にしました`]; render();
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ if (g.dataset.go === "tour") ui.check = ""; return go(g.dataset.go, g.dataset.go === "tour" ? Number(g.dataset.arg) : g.dataset.arg || null); }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  run(() => {
    if (act === "confirm"){ ui.confirm = arg || null; render(); }
    else if (act === "cancel-booking"){ cancelBooking(Number(arg), today, OP); ui.confirm = null; ui.flash = ["ok","予約を取り消し、使ったポイントをお戻ししました"]; render(); }
    else if (act === "expire"){ const n = expirePoints(today); go("home", null, ["ok", `失効処理を実行しました（${yen(n)}pt 失効）`]); }
    else if (act === "reset"){ today = localToday(); seed(today); save(); ui.query = ""; ui.check = ""; go("home", null, ["ok","サンプルデータに戻しました"]); }
  });
});

document.addEventListener("change", e => {
  if (e.target.id === "demo-date") setDate(e.target.value);
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), v = Object.fromEntries(fd);
  run(() => {
    switch (f.dataset.form){
      case "search": ui.query = v.q || ""; render(); break;
      case "register": { const m = registerMember(v, today, OP); go("member", m.member_no, ["ok", `入会登録しました。会員番号は ${m.member_no} です`]); break; }
      case "adjust": { const p = num(v.points); adjustPoints(ui.param, p, v.reason, today, OP); go("member", ui.param, ["ok", `${p > 0 ? "+" : ""}${yen(p)}pt 調整しました`]); break; }
      case "withdraw": if (!v.confirm) throw new PointError("確認のチェックを入れてください"); withdrawMember(ui.param, today, OP); go("member", ui.param, ["ok","退会処理を行いました"]); break;
      case "tour": { const t = createTour({...v, price:num(v.price), bonus_multiplier:num(v.bonus_multiplier || 1), bonus_points:num(v.bonus_points || 0)}); ui.check = ""; go("tour", t.id, ["ok","ツアーを登録しました"]); break; }
      case "check": ui.check = (v.member_no || "").trim(); render(); break;
      case "book": { const p = num(v.points || 0); bookTour(ui.check, ui.param, p, today, OP); ui.check = ""; go("tour", ui.param, ["ok","予約を登録しました"]); break; }
      case "complete": { const n = completeTour(ui.param, today, OP, fd.getAll("absent").map(Number)); go("tour", ui.param, ["ok", `催行完了として ${yen(n)}pt を付与しました`]); break; }
      case "cancel-tour": if (!v.confirm) throw new PointError("確認のチェックを入れてください"); cancelTour(ui.param, today, OP); go("tour", ui.param, ["ok","ツアーを中止し、使ったポイントをお戻ししました"]); break;
    }
  });
});

// 会員ページ（別タブ・スマホ表示の枠）での変更を反映する
window.addEventListener("storage", e => { if (e.key === STORE_KEY){ bootData(); render(); } });

bootData();
render();
</script>
<script src="../assets/viewswitch.js"></script>
</body>
</html>
