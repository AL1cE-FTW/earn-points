<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バスツアー会員ポイント</title>
<style>
/* Layout: 上部バーで「スタッフ／会員／制度」を切替え、中央1カラム（最大960px）に画面を積む業務UI */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --fg:#16231c; --muted:#5a6a61; --line:#dce5df;
  --accent:#1d6a44; --accent-ink:#ffffff; --accent-soft:#e2f0e7;
  --plus:#16803c; --minus:#b42318; --warn-bg:#fff3d1; --warn-fg:#6a4b00;
  --gold-bg:#f9e7a8; --gold-fg:#5e4500; --silver-bg:#e3e8ec; --silver-fg:#34404a;
  --bar:#173f2b; --bar-ink:#eaf5ee;
  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --fg:#e3ece6; --muted:#98a99f; --line:#29352e;
  --accent:#5cc48a; --accent-ink:#08170e; --accent-soft:#1b3326;
  --plus:#5cc48a; --minus:#f08679; --warn-bg:#3d3112; --warn-fg:#f3d98a;
  --gold-bg:#4a3a0e; --gold-fg:#f6d67a; --silver-bg:#2a3238; --silver-fg:#d3dbe1;
  --bar:#0a1f14; --bar-ink:#d9eee1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --fg:#e3ece6; --muted:#98a99f; --line:#29352e;
  --accent:#5cc48a; --accent-ink:#08170e; --accent-soft:#1b3326;
  --plus:#5cc48a; --minus:#f08679; --warn-bg:#3d3112; --warn-fg:#f3d98a;
  --gold-bg:#4a3a0e; --gold-fg:#f6d67a; --silver-bg:#2a3238; --silver-fg:#d3dbe1;
  --bar:#0a1f14; --bar-ink:#d9eee1; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.65}
.topbar{background:var(--bar);color:var(--bar-ink);padding:.6rem 16px;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.02em;margin-right:auto}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px}
.seg button{background:transparent;color:var(--bar-ink);border:0;margin:0;padding:.35rem .8rem;border-radius:6px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo{background:var(--warn-bg);color:var(--warn-fg);padding:.5rem 16px;font-size:.85rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center}
.demo b{font-weight:700}
.demo label{display:inline-flex;gap:.4rem;align-items:center;margin:0;font-weight:600}
.demo input{width:auto;padding:.15rem .4rem;font-size:.85rem}
.demo button{margin:0;padding:.2rem .7rem;font-size:.82rem}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:1rem 3rem;display:grid;gap:1rem}
.subnav{display:flex;flex-wrap:wrap;gap:.4rem}
.subnav button{margin:0;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.subnav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;min-width:0}
h1{font-size:1.35rem;margin:0 0 .8rem;text-wrap:balance}
h2{font-size:1.05rem;margin:0 0 .7rem;text-wrap:balance}
h3{font-size:.95rem;margin:1rem 0 .4rem}
p{margin:.3rem 0}
.muted{color:var(--muted);font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:.6rem}
.stat{background:var(--accent-soft);border-radius:8px;padding:.6rem .8rem}
.stat span{display:block;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.stat b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
.scroll table{min-width:560px}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.big{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big small{font-size:1rem;color:var(--muted);margin-left:.2rem}
.pill{display:inline-block;padding:.05rem .6rem;border-radius:99px;font-size:.82rem;font-weight:700;background:var(--silver-bg);color:var(--silver-fg)}
.pill.regular{background:var(--accent-soft);color:var(--fg)}
.pill.gold{background:var(--gold-bg);color:var(--gold-fg)}
.pill.st-booked{background:var(--accent-soft);color:var(--fg)}
.pill.st-cancelled,.pill.st-no_show{background:var(--silver-bg);color:var(--muted)}
label{display:block;margin:.5rem 0 .2rem;font-weight:600;font-size:.86rem}
label.check{display:flex;gap:.5rem;align-items:flex-start;font-weight:500}
input,select{font:inherit;color:var(--fg);background:var(--surface);padding:.45rem .55rem;border:1px solid var(--line);border-radius:6px;width:100%;max-width:360px}
input[type=checkbox]{width:auto;margin-top:.35rem}
button{font:inherit;padding:.45rem 1rem;border:1px solid transparent;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:.6rem;font-weight:600}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.danger{background:var(--minus);color:var(--surface)}
button.small{padding:.15rem .6rem;margin:0;font-size:.82rem}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{padding:.6rem 1rem;border-radius:8px;border:1px solid var(--line)}
.msg.ok{background:var(--accent-soft)} .msg.err{background:var(--warn-bg);color:var(--warn-fg)}
.link{background:none;border:0;color:var(--accent);padding:0;margin:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end}
.row > *{min-width:0}
ul{padding-left:1.2rem;margin:.3rem 0} li{margin:.2rem 0}
/* 会員証：バスの乗車券をモチーフにしたミシン目つきカード */
.ticket{max-width:100%;width:340px;aspect-ratio:86/54;border-radius:12px;background:var(--bar);color:var(--bar-ink);display:grid;grid-template-columns:1fr 26%;overflow:hidden;position:relative;border:1px solid var(--line)}
.ticket .main{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.ticket .stub{border-left:2px dashed rgba(255,255,255,.35);padding:12px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:.7rem;text-align:center}
.ticket .stub .pill{white-space:nowrap;font-size:.72rem;padding:.05rem .45rem}
.ticket .no{font-family:var(--font-num);font-size:1.35rem;letter-spacing:.12em;font-weight:700}
.ticket .label{font-size:.68rem;letter-spacing:.12em;opacity:.8}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(3px)}to{transform:none}}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">バスツアー会員ポイント</div>
  <nav class="seg" aria-label="画面の切替">
    <button type="button" data-mode="admin">スタッフ画面</button>
    <button type="button" data-mode="member">会員ページ</button>
    <button type="button" data-mode="rules">制度のご案内</button>
  </nav>
</header>
<div class="demo" role="note">
  <span><b>デモ版</b>：入力したデータはこのブラウザの中にだけ保存されます。実在の個人情報は入力しないでください。</span>
  <label for="demo-date">デモの日付 <input type="date" id="demo-date"></label>
  <button type="button" class="ghost" id="demo-reset">サンプルデータに戻す</button>
</div>
<main id="app"></main>

<script>
"use strict";
// ===== 制度ルール（Python版 points/rules.py と同じ値） =====
const RULES = {
  YEN_PER_POINT: 100, WELCOME_BONUS: 300, BIRTHDAY_BONUS: 200, REFERRAL_BONUS: 500,
  RANKS: [["regular","レギュラー",0,1.0],["silver","シルバー",3,1.5],["gold","ゴールド",6,2.0]],
  RANK_WINDOW_DAYS: 365, REDEEM_UNIT: 100, EXPIRY_YEARS: 2,
};
const KIND = {earn:"ツアー参加",bonus:"特典",redeem:"利用",restore:"返還",expire:"失効",adjust:"調整",forfeit:"退会失効"};
const BOOKING = {booked:"参加予定",completed:"参加済",no_show:"不参加",cancelled:"取消"};
const TOUR = {scheduled:"催行予定",completed:"催行完了",cancelled:"中止"};
const STORE_KEY = "bt-points-demo-v1";

class PointError extends Error {}

// ===== 日付 =====
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate()+n); return isoOf(d); };
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function expiryDate(granted){
  const [y,m] = granted.split("-").map(Number);
  return isoOf(new Date(Date.UTC(y + RULES.EXPIRY_YEARS, m, 0)));  // 2年後の月末
}
const yen = n => n.toLocaleString("ja-JP");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== 会員番号（Luhn チェックディジット） =====
function checkDigit(digits){
  let total = 0;
  [...digits].reverse().forEach((ch, i) => { let n = +ch; if (i % 2 === 0){ n *= 2; if (n > 9) n -= 9; } total += n; });
  return String((10 - total % 10) % 10);
}
const makeMemberNo = seq => { const body = String(seq).padStart(7,"0"); return "BT" + body + checkDigit(body); };
function normalizeMemberNo(text){
  const s = String(text || "").trim().toUpperCase().replace(/[-\s]/g, "");
  if (!/^BT\d{8}$/.test(s)) throw new PointError("会員番号の形式が正しくありません（例: BT00000018）");
  if (checkDigit(s.slice(2,9)) !== s[9]) throw new PointError("会員番号が正しくありません。入力内容をご確認ください");
  return s;
}

// ===== データ =====
let db;
const emptyDb = () => ({seq:{member:0,tour:0,booking:0,txn:0,lot:0}, members:[], tours:[], bookings:[], txns:[], lots:[], usages:[]});
const nextId = k => ++db.seq[k];
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({db, today})); } catch (e) {} }
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw){ const v = JSON.parse(raw); return v; } } catch (e) {}
  return null;
}
// 変更系の処理は失敗したら丸ごと元に戻す（DBのトランザクション相当）
function tx(fn){
  const backup = JSON.stringify(db);
  try { const r = fn(); save(); return r; } catch (e) { db = JSON.parse(backup); throw e; }
}

const memberById = id => db.members.find(m => m.id === id);
function getMember(no){
  const m = db.members.find(m => m.member_no === normalizeMemberNo(no));
  if (!m) throw new PointError("該当する会員が見つかりません");
  return m;
}
function getTour(id){
  const t = db.tours.find(t => t.id === id);
  if (!t) throw new PointError("ツアーが見つかりません");
  return t;
}

// ===== 残高・台帳 =====
const balance = (mid, d) => db.lots.filter(l => l.member_id === mid && l.expires_on >= d).reduce((a,l) => a + l.remaining, 0);
function expiringSchedule(mid, d){
  const map = new Map();
  db.lots.filter(l => l.member_id === mid && l.expires_on >= d && l.remaining > 0)
    .forEach(l => map.set(l.expires_on, (map.get(l.expires_on) || 0) + l.remaining));
  return [...map].sort((a,b) => a[0] < b[0] ? -1 : 1);
}
function addTxn(mid, kind, points, reason, d, booking_id = null, operator = ""){
  const t = {id:nextId("txn"), member_id:mid, kind, points, reason, booking_id, created_on:d, operator};
  db.txns.push(t); return t.id;
}
function grant(mid, kind, points, reason, d, booking_id, operator){
  if (points <= 0) return null;
  const txn = addTxn(mid, kind, points, reason, d, booking_id, operator);
  db.lots.push({id:nextId("lot"), member_id:mid, txn_id:txn, amount:points, remaining:points, granted_on:d, expires_on:expiryDate(d)});
  return txn;
}
// 有効期限の近い付与分から順に消費
function consume(mid, kind, points, reason, d, booking_id, operator){
  if (points <= 0) return null;
  if (balance(mid, d) < points) throw new PointError("ポイント残高が不足しています");
  const txn = addTxn(mid, kind, -points, reason, d, booking_id, operator);
  let left = points;
  const lots = db.lots.filter(l => l.member_id === mid && l.expires_on >= d && l.remaining > 0)
    .sort((a,b) => a.expires_on === b.expires_on ? a.id - b.id : (a.expires_on < b.expires_on ? -1 : 1));
  for (const lot of lots){
    const use = Math.min(left, lot.remaining);
    lot.remaining -= use; db.usages.push({txn_id:txn, lot_id:lot.id, points:use}); left -= use;
    if (!left) break;
  }
  return txn;
}

// ===== 会員 =====
function registerMember({name, pin, kana = "", phone = "", email = "", birthdate = "", referrer_no = ""}, d, op = ""){
  name = (name || "").trim();
  if (!name) throw new PointError("氏名は必須です");
  if (!/^\d{4,8}$/.test(pin || "")) throw new PointError("暗証番号は4〜8桁の数字で設定してください");
  return tx(() => {
    let referrer_id = null;
    if (referrer_no){
      const ref = getMember(referrer_no);
      if (ref.status !== "active") throw new PointError("紹介者の会員番号は現在有効ではありません");
      referrer_id = ref.id;
    }
    const id = nextId("member");
    const m = {id, member_no:makeMemberNo(id), name, kana:kana.trim(), phone:phone.trim(), email:email.trim(),
               birthdate:birthdate || null, pin, referrer_id, status:"active", joined_on:d};
    db.members.push(m);
    grant(id, "bonus", RULES.WELCOME_BONUS, "入会特典", d, null, op);
    return m;
  });
}
function authenticate(no, pin){
  let m; try { m = getMember(no); } catch (e) { return null; }
  return m.status === "active" && m.pin === pin ? m : null;
}
function rankFor(mid, on){
  const start = addDays(on, -RULES.RANK_WINDOW_DAYS);
  const count = db.bookings.filter(b => b.member_id === mid && b.status === "completed").map(b => getTour(b.tour_id))
    .filter(t => t.depart_date >= start && t.depart_date < on).length;
  let cur = RULES.RANKS[0];
  for (const r of RULES.RANKS) if (count >= r[2]) cur = r;
  const next = RULES.RANKS.find(r => r[2] > count);
  return {code:cur[0], name:cur[1], multiplier:cur[3], tours:count, next_name:next ? next[1] : null, tours_to_next:next ? next[2]-count : 0};
}
function adjustPoints(no, points, reason, d, op){
  reason = (reason || "").trim();
  if (!reason) throw new PointError("調整理由を入力してください");
  if (!Number.isInteger(points) || points === 0) throw new PointError("調整ポイントを整数で入力してください");
  tx(() => {
    const m = getMember(no);
    if (m.status !== "active") throw new PointError("退会済み会員のポイントは調整できません");
    if (points > 0) grant(m.id, "adjust", points, reason, d, null, op);
    else consume(m.id, "adjust", -points, reason, d, null, op);
  });
}
function withdrawMember(no, d, op){
  tx(() => {
    const m = getMember(no);
    if (m.status !== "active") throw new PointError("すでに退会済みです");
    if (db.bookings.some(b => b.member_id === m.id && b.status === "booked"))
      throw new PointError("参加予定のツアーがあるため退会できません。先に予約を取り消してください");
    const bal = balance(m.id, d);
    if (bal) consume(m.id, "forfeit", bal, "退会による失効", d, null, op);
    m.status = "withdrawn";
  });
}
function expirePoints(d){
  let total = 0;
  tx(() => {
    const byMember = new Map();
    db.lots.filter(l => l.expires_on < d && l.remaining > 0).forEach(l => {
      if (!byMember.has(l.member_id)) byMember.set(l.member_id, []); byMember.get(l.member_id).push(l);
    });
    for (const [mid, lots] of byMember){
      const pts = lots.reduce((a,l) => a + l.remaining, 0);
      const txn = addTxn(mid, "expire", -pts, "有効期限切れによる失効", d, null, "system");
      lots.forEach(l => { db.usages.push({txn_id:txn, lot_id:l.id, points:l.remaining}); l.remaining = 0; });
      total += pts;
    }
  });
  return total;
}

// ===== ツアー・予約 =====
function createTour({code, name, depart_date, price, bonus_multiplier = 1, bonus_points = 0}){
  code = (code || "").trim(); name = (name || "").trim();
  if (!code || !name || !depart_date) throw new PointError("ツアーコード・ツアー名・出発日は必須です");
  if (!(price > 0)) throw new PointError("代金は1円以上で入力してください");
  if (!(bonus_multiplier >= 1) || !(bonus_points >= 0)) throw new PointError("キャンペーン倍率は1以上、加算ポイントは0以上で入力してください");
  if (db.tours.some(t => t.code === code)) throw new PointError("同じツアーコードがすでに登録されています");
  return tx(() => { const t = {id:nextId("tour"), code, name, depart_date, price, bonus_multiplier, bonus_points, status:"scheduled"}; db.tours.push(t); return t; });
}
function maxRedeemable(mid, price, d){
  const b = Math.min(balance(mid, d), price);
  return b - b % RULES.REDEEM_UNIT;
}
function bookTour(no, tourId, points, d, op){
  return tx(() => {
    const m = getMember(no);
    if (m.status !== "active") throw new PointError("退会済みの会員です");
    const t = getTour(tourId);
    if (t.status !== "scheduled") throw new PointError("このツアーは予約を受け付けていません");
    if (db.bookings.some(b => b.member_id === m.id && b.tour_id === tourId && b.status !== "cancelled"))
      throw new PointError("この会員はすでにこのツアーを予約しています");
    if (!Number.isInteger(points) || points < 0 || points % RULES.REDEEM_UNIT)
      throw new PointError(`ポイントは${RULES.REDEEM_UNIT}ポイント単位でご利用いただけます`);
    if (points > maxRedeemable(m.id, t.price, d)) throw new PointError("利用ポイントが残高またはツアー代金を超えています");
    const b = {id:nextId("booking"), member_id:m.id, tour_id:tourId, price:t.price, points_used:points, status:"booked", booked_on:d};
    db.bookings.push(b);
    if (points) consume(m.id, "redeem", points, `ツアー代金に利用（${t.name}）`, d, b.id, op);
    return b;
  });
}
// 利用ポイントを元の付与分（元の有効期限）へ戻す
function restorePoints(b, d, op){
  const redeemTxns = db.txns.filter(t => t.booking_id === b.id && t.kind === "redeem").map(t => t.id);
  const uses = db.usages.filter(u => redeemTxns.includes(u.txn_id));
  const total = uses.reduce((a,u) => a + u.points, 0);
  if (!total) return;
  addTxn(b.member_id, "restore", total, "予約取消によるポイント返還", d, b.id, op);
  uses.forEach(u => { db.lots.find(l => l.id === u.lot_id).remaining += u.points; });
}
function cancelBooking(id, d, op){
  tx(() => {
    const b = db.bookings.find(b => b.id === id);
    if (!b) throw new PointError("予約が見つかりません");
    if (b.status !== "booked") throw new PointError("参加予定の予約のみ取り消せます");
    b.status = "cancelled"; restorePoints(b, d, op);
  });
}
function cancelTour(id, d, op){
  tx(() => {
    const t = getTour(id);
    if (t.status !== "scheduled") throw new PointError("催行予定のツアーのみ中止できます");
    db.bookings.filter(b => b.tour_id === id && b.status === "booked").forEach(b => { b.status = "cancelled"; restorePoints(b, d, op); });
    t.status = "cancelled";
  });
}
function estimateEarn(m, t, paid){
  const rank = rankFor(m.id, t.depart_date);
  const base = Math.floor(paid / RULES.YEN_PER_POINT);
  const items = [["基本", Math.floor(base * rank.multiplier * t.bonus_multiplier + 1e-9)]];
  if (t.bonus_points) items.push(["キャンペーン加算", t.bonus_points]);
  if (m.birthdate && m.birthdate.slice(5,7) === t.depart_date.slice(5,7)) items.push(["誕生月特典", RULES.BIRTHDAY_BONUS]);
  return {rank, items};
}
function completeTour(id, d, op, absent = []){
  let granted = 0;
  tx(() => {
    const t = getTour(id);
    if (t.status !== "scheduled") throw new PointError("催行予定のツアーのみ完了処理できます");
    if (t.depart_date > d) throw new PointError("出発日より前に完了処理はできません");
    for (const b of db.bookings.filter(b => b.tour_id === id && b.status === "booked")){
      if (absent.includes(b.id)){ b.status = "no_show"; continue; }
      const m = memberById(b.member_id);
      const first = !db.bookings.some(x => x.member_id === m.id && x.status === "completed");
      const {rank, items} = estimateEarn(m, t, b.price - b.points_used);
      b.status = "completed";
      if (m.status !== "active") continue;
      for (const [label, pts] of items){
        let kind = "bonus", reason = `ツアー参加 ${label}`;
        if (label === "基本"){
          let detail = `${rank.name}×${rank.multiplier}`;
          if (t.bonus_multiplier !== 1) detail += `・キャンペーン×${t.bonus_multiplier}`;
          kind = "earn"; reason += `（${detail}）`;
        }
        if (grant(m.id, kind, pts, reason, d, b.id, op)) granted += pts;
      }
      if (first && m.referrer_id){
        const ref = memberById(m.referrer_id);
        if (ref.status === "active"){ grant(ref.id, "bonus", RULES.REFERRAL_BONUS, `ご紹介特典（${m.name}様 初参加）`, d, null, op); granted += RULES.REFERRAL_BONUS; }
      }
    }
    t.status = "completed";
  });
  return granted;
}

      <h3>デモ用のサンプル会員</h3><ul>${s.map(m => `<li><span style="font-family:var(--font-num)">${m.member_no}</span> ／ 暗証番号 ${esc(m.pin)}（${esc(m.name)}）</li>`).join("")}</ul></section>`;
  },
  me(){
    const m = getMember(ui.memberNo);
    return memberSummary(m, false) + `<section class="card"><button type="button" class="ghost" data-act="logout">ログアウト</button></section>`;
  },
  rules(){
    return `<section class="card"><h1>ポイント制度のご案内</h1>
      <h2>ためる</h2><ul>
      <li>ご入会で <b>${RULES.WELCOME_BONUS}ポイント</b></li>
      <li>ツアーのお支払額（ポイント利用分を除く税込代金）<b>${RULES.YEN_PER_POINT}円ごとに1ポイント</b> × 会員ランク倍率。ツアー終了後に付与します。</li>
      <li>お誕生月に出発するツアーにご参加で <b>${RULES.BIRTHDAY_BONUS}ポイント</b> 追加</li>
      <li>ご紹介いただいた方が初めてツアーに参加されると、ご紹介者に <b>${RULES.REFERRAL_BONUS}ポイント</b></li>
      <li>対象ツアーではキャンペーンによるポイント倍増・加算があります</li></ul></section>
    <section class="card"><h2>会員ランク</h2><div class="scroll"><table><thead><tr><th>ランク</th><th>条件</th><th class="num">基本ポイント倍率</th></tr></thead><tbody>${
      RULES.RANKS.map(([c,n,need,mult]) => `<tr><td>${pill(c,n)}</td><td>${need ? `直近1年で${need}回以上参加` : "ご入会時"}</td><td class="num">×${mult}</td></tr>`).join("")
    }</tbody></table></div><p class="muted">ランクはツアー出発日より前の${RULES.RANK_WINDOW_DAYS}日間の参加回数で自動判定します。</p></section>
    <div class="grid2">
    <section class="card"><h2>つかう</h2><ul><li>${RULES.REDEEM_UNIT}ポイント単位で、1ポイント＝1円としてツアー代金のお支払いにご利用いただけます。</li>
      <li>予約を取り消した場合、利用したポイントは元の有効期限のままお戻しします。</li></ul></section>
    <section class="card"><h2>有効期限</h2><ul><li>付与日から${RULES.EXPIRY_YEARS}年後の月末まで有効です。期限の近いポイントから使われます。</li>
      <li>退会された場合、保有ポイントはすべて失効します。</li><li>換金・他の会員への譲渡はできません。</li></ul></section></div>`;
  },
};

const ADMIN_TABS = [["home","会員"],["tours","ツアー"],["newMember","新規入会"]];
function render(){
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === ui.mode)));
  document.getElementById("demo-date").value = today;
  let html = "";
  if (ui.mode === "admin"){
    const cur = ui.view === "member" ? "home" : ui.view === "tour" ? "tours" : ui.view;
    html += `<nav class="subnav" aria-label="スタッフメニュー">${ADMIN_TABS.map(([v,l]) => `<button type="button" data-go="${v}" ${cur === v ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</nav>`;
  }
  if (ui.flash) html += `<div class="msg ${ui.flash[0]}" role="status">${esc(ui.flash[1])}</div>`;
  try { html += views[ui.view](); }
  catch (e) { if (!(e instanceof PointError)) throw e; html += `<div class="msg err">${esc(e.message)}</div>`; }
  app.innerHTML = html;
}

function run(fn){
  try { fn(); }
  catch (e) { if (!(e instanceof PointError)) throw e; ui.flash = ["err", e.message]; ui.confirm = null; render(); }
}
const num = v => { const s = String(v ?? "").replace(/[,，\s]/g, ""); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; };

document.addEventListener("click", e => {
  const mode = e.target.closest("[data-mode]");
  if (mode) return setMode(mode.dataset.mode);
  const g = e.target.closest("[data-go]");
  if (g){ if (g.dataset.go === "tour") ui.check = ""; return go(g.dataset.go, g.dataset.go === "tour" ? Number(g.dataset.arg) : g.dataset.arg || null); }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  run(() => {
    if (act === "confirm"){ ui.confirm = arg || null; ui.flash = null; render(); }
    else if (act === "cancel-booking"){ cancelBooking(Number(arg), today, OP); ui.confirm = null; ui.flash = ["ok","予約を取り消し、利用ポイントを返還しました"]; render(); }
    else if (act === "expire"){ const n = expirePoints(today); go("home", null, ["ok", `失効処理を実行しました（${yen(n)}ポイント失効）`]); }
    else if (act === "logout"){ ui.memberNo = null; go("login", null, ["ok","ログアウトしました"]); }
  });
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), v = Object.fromEntries(fd);
  run(() => {
    switch (f.dataset.form){
      case "search": ui.query = v.q || ""; render(); break;
      case "register": { const m = registerMember(v, today, OP); go("member", m.member_no, ["ok", `入会登録しました。会員番号 ${m.member_no}`]); break; }
      case "adjust": { const p = num(v.points); adjustPoints(ui.param, p, v.reason, today, OP); go("member", ui.param, ["ok", `${p > 0 ? "+" : ""}${yen(p)}ポイント調整しました`]); break; }
      case "withdraw": if (!v.confirm) throw new PointError("確認のチェックを入れてください"); withdrawMember(ui.param, today, OP); go("member", ui.param, ["ok","退会処理を行いました"]); break;
      case "tour": { const t = createTour({...v, price:num(v.price), bonus_multiplier:num(v.bonus_multiplier || 1), bonus_points:num(v.bonus_points || 0)}); ui.check = ""; go("tour", t.id, ["ok","ツアーを登録しました"]); break; }
      case "check": ui.check = (v.member_no || "").trim(); ui.flash = null; render(); break;
      case "book": { const p = num(v.points || 0); bookTour(ui.check, ui.param, p, today, OP); ui.check = ""; go("tour", ui.param, ["ok","予約を登録しました"]); break; }
      case "complete": { const n = completeTour(ui.param, today, OP, fd.getAll("absent").map(Number)); go("tour", ui.param, ["ok", `催行完了として${yen(n)}ポイントを付与しました`]); break; }
      case "cancel-tour": if (!v.confirm) throw new PointError("確認のチェックを入れてください"); cancelTour(ui.param, today, OP); go("tour", ui.param, ["ok","ツアーを中止し、利用ポイントを返還しました"]); break;
      case "login": { const m = authenticate(v.member_no, v.pin); if (!m) throw new PointError("会員番号または暗証番号が正しくありません"); ui.memberNo = m.member_no; go("me"); break; }
    }
  });
});

document.getElementById("demo-date").addEventListener("change", e => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return;
  today = e.target.value; save(); ui.flash = ["ok", `デモの日付を ${today} にしました`]; render();
});
document.getElementById("demo-reset").addEventListener("click", () => {
  today = localToday(); seed(today); save(); ui.memberNo = null; ui.query = ""; ui.check = "";
  setMode(ui.mode); ui.flash = ["ok","サンプルデータに戻しました"]; render();
});

// 起動
const saved = load();
if (saved && saved.db && saved.db.seq){ db = saved.db; today = saved.today || today; }
else { seed(today); save(); }
render();
</script>
</body>
</html>
