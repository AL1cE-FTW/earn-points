<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6a4b">
<title>バスツアー会員ページ</title>
<link rel="stylesheet" href="../assets/ui.css">
<style>
/* Layout: スマホは1カラム＋下部タブ。PC（960px以上）は左に白いメニュー、右に本文 */
html,body{min-height:100%}
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr}
.content{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.8rem;padding:.6rem 16px;padding-top:calc(.6rem + env(safe-area-inset-top,0px));background:var(--bar);color:var(--on-bar)}
.brand{text-decoration:none;color:inherit;margin-right:auto;font-weight:700;font-size:1.05rem}
.demo{font-size:var(--t-xs);font-weight:700;padding:0 .5rem;border-radius:var(--radius-sm);background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
main{width:100%;max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:1rem calc(84px + env(safe-area-inset-bottom,0px));display:grid;gap:1rem;align-content:start}
.page-title h1{font-size:var(--t-xl)}
.grid{display:grid;gap:1rem}
.grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;display:grid;gap:.7rem;align-content:start;min-width:0}
.card h2{font-size:var(--t-md);display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.5rem}
.card h2 .link{margin-left:auto;font:inherit;font-size:var(--t-sm);font-weight:400;background:none;border:0;color:var(--link);cursor:pointer;padding:0;text-decoration:underline}
.notice{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--radius-sm);padding:.5rem .7rem;font-size:var(--t-sm)}
table.plain{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.plain th,table.plain td{padding:.45rem .2rem;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
table.plain td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.linkbtn{justify-self:start;font:inherit;font-size:var(--t-sm);background:none;border:0;color:var(--link);cursor:pointer;padding:0;text-decoration:underline}
.kv{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;font-size:var(--t-sm);margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* 次のツアー */
.next dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0;font-size:var(--t-sm)}
.next dt{color:var(--ink-2)} .next dd{margin:0;font-weight:700}
.next .tname{font-size:var(--t-lg);font-weight:700}

/* 履歴：日付・内容・ポイントの表 */
table.hist{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.hist th{background:var(--surface-2);font-size:var(--t-xs);color:var(--ink-2);text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.hist td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
table.hist .d{white-space:nowrap;color:var(--ink-2);font-size:var(--t-xs)}
table.hist .p{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
table.hist .k{display:block;font-size:var(--t-xs);color:var(--ink-2)}

/* ツアー一覧 */
.trip{display:grid;gap:.15rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:var(--t-sm)}
.trip .name{font-weight:700;overflow-wrap:anywhere}
.trip .facts{display:flex;flex-wrap:wrap;gap:.1rem 1rem;font-size:var(--t-sm);color:var(--ink-2)}
.how{margin:0;padding-left:1.2rem;display:grid;gap:.3rem;font-size:var(--t-sm)}
form.stack{display:grid;gap:.8rem}

/* ログイン */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.login main{max-width:460px;padding-bottom:3rem}
.login h1{font-size:var(--t-xl)}
.samples{display:flex;flex-wrap:wrap;gap:.4rem}
.samples button{font:inherit;font-size:var(--t-sm);font-weight:700;padding:.35rem .7rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.samples button:hover{border-color:var(--brand);background:var(--brand-soft)}
.samples small{display:block;font-weight:400;color:var(--ink-2);font-size:var(--t-xs)}

/* メニュー（スマホ：下部タブ／PC：左の白いメニュー） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.navbtn{font:inherit;background:transparent;border:0;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:700}
.navbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--brand)}
.tabbar .navbtn[aria-current="page"]{box-shadow:inset 0 3px 0 var(--brand)}
.side{display:none}

/* アプリ風：角丸・影・グラデーションの会員カード（このページだけ。共通のui.cssは業務画面のまま） */
:root{--radius:14px;--radius-sm:10px}
.appbar{background:var(--surface);color:var(--brand);box-shadow:0 1px 0 var(--line)}
.card{border:0;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);padding:1.1rem 1.2rem}
.card h2{border-bottom:0;padding-bottom:0}
.hero{--c1:#2a8c63;--c2:#14513a;position:relative;overflow:hidden;color:#fff;border-radius:20px;padding:1.1rem 1.3rem 1.2rem;display:grid;gap:.15rem;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px rgba(20,81,58,.28)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero.rank-silver{--c1:#7d8a99;--c2:#3e4955;box-shadow:0 10px 24px rgba(62,73,85,.28)}
.hero.rank-gold{--c1:#d4a53c;--c2:#8a5d12;box-shadow:0 10px 24px rgba(138,93,18,.3)}
.hero .h-top{display:flex;justify-content:space-between;align-items:center;font-size:var(--t-xs);font-weight:700;opacity:.95}
.hero .h-rank{background:rgba(255,255,255,.22);border-radius:999px;padding:.05rem .7rem}
.hero .h-label{margin-top:.6rem;font-size:var(--t-xs);opacity:.85}
.hero .h-pt{display:flex;align-items:baseline;gap:.3rem;line-height:1.1}
.hero .h-pt b{font-size:2.9rem;letter-spacing:.01em}
.hero .h-pt span{font-weight:700;font-size:var(--t-lg)}
.hero .h-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:.8rem;font-size:var(--t-sm)}
.hero .h-foot .mono{letter-spacing:.08em}
.hero-note{text-align:center;font-size:var(--t-xs);color:var(--ink-2);margin-top:.4rem}
.chip-next{margin-top:.8rem;display:flex;align-items:center;gap:.6rem;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:.45rem 1rem;font-size:var(--t-sm);font-weight:700}
.chip-next b{margin-left:auto;white-space:nowrap}
.route{border:0;gap:6px;overflow:visible}
.route .stop{border:0;border-radius:12px;background:var(--surface-2)}
.route .stop.done{background:var(--brand-soft)}
.tabbar{box-shadow:0 -4px 16px rgba(0,0,0,.06);border-top:0}
.tabbar .navbtn[aria-current="page"]{box-shadow:none}
.tabbar .navbtn svg{width:46px;height:28px;padding:3px 12px;border-radius:999px;box-sizing:border-box}
.tabbar .navbtn[aria-current="page"] svg{background:var(--brand-soft)}

@media (min-width:960px){
  .app.signed{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:1rem 0;overflow:auto}
  .side .brand{padding:0 1rem;margin:0;color:var(--ink)}
  .side nav{display:grid;border-top:1px solid var(--line)}
  .side .navbtn{flex-direction:row;justify-content:flex-start;gap:.7rem;font-size:var(--t-sm);padding:.75rem 1rem;color:var(--ink);border-bottom:1px solid var(--line)}
  .side .navbtn:hover{background:var(--surface-2)}
  .side .navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
  .side .who{margin-top:auto;padding:0 1rem;display:grid;font-size:var(--t-sm)}
  .side .who span{color:var(--ink-2);font-size:var(--t-xs)}
  .side .links{display:grid;gap:.2rem;font-size:var(--t-xs);padding:0 1rem}
  .side .links button{color:var(--link);background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;text-decoration:underline}
  .tabbar{display:none}
  .app.signed .appbar .brand{visibility:hidden}
  main{padding-inline:24px;padding-bottom:3rem}
  .grid.two{grid-template-columns:1fr 1fr;align-items:start}
  .grid.two-even{grid-template-columns:1fr 1fr;align-items:start}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="../points.js"></script>
<script>
"use strict";
// 会員（旅行客）向けアプリ。スタッフ画面と同じブラウザ内のデータを読む。
const SESSION_KEY = "bt-points-member-v1";
const root = document.getElementById("root");
const ui = {tab:"home", memberNo:null, flash:null};

function remember(no){ try { no ? localStorage.setItem(SESSION_KEY, no) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function recall(){ try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } }
function current(){
  if (!ui.memberNo) return null;
  try { const m = getMember(ui.memberNo); return m.status === "active" ? m : null; } catch (e) { return null; }
}
const jp = s => { const [y,m,d] = s.split("-").map(Number); return `${y}年${m}月${d}日`; };
const slash = s => s.replace(/-/g, "/");
const WEEK = "日月火水木金土";
const weekday = s => WEEK[parse(s).getUTCDay()];
const flashHtml = () => ui.flash ? `<div class="toast ${ui.flash[0]}" role="status">${esc(ui.flash[1])}</div>` : "";

const ICONS = {
  home:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><path d="M6 10h6M6 14h4"/></svg>`,
  history:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>`,
  tours:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="14" rx="2"/><path d="M3.5 11h17M7.5 17.5V20M16.5 17.5V20"/></svg>`,
  info:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>`,
};
const TABS = [["home","会員証"],["history","ポイント履歴"],["tours","ツアー"],["info","ご案内"]];
const TAB_SHORT = {home:"会員証", history:"履歴", tours:"ツアー", info:"ご案内"};

function histRow(r){
  const b = r.booking_id && db.bookings.find(x => x.id === r.booking_id);
  const tn = b ? getTour(b.tour_id).name : "";
  const title = (r.kind === "earn" || r.kind === "bonus") && tn && !r.reason.includes(tn) ? `${r.reason}／${tn}` : r.reason;
  const upv = r.points > 0;
  return `<tr><td class="d num">${slash(r.created_on)}</td><td>${esc(title)}<span class="k">${KIND[r.kind]}</span></td>
    <td class="p ${upv ? "plus" : "minus"}">${upv ? "+" : "−"}${yen(Math.abs(r.points))}pt</td></tr>`;
}
const histTable = rows => `<table class="hist"><thead><tr><th>日付</th><th>内容</th><th style="text-align:right">ポイント</th></tr></thead><tbody>${rows.map(histRow).join("")}</tbody></table>`;

function hero(m, rank, bal){
  return `<section class="hero rank-${rank.code}" aria-label="会員証 ${m.member_no} ${esc(m.name)}様 ${esc(rank.name)} 保有${yen(bal)}ポイント">
    <div class="h-top"><span>バスツアー会員証</span><span class="h-rank">${esc(rank.name)}・${rank.multiplier}倍</span></div>
    <div class="h-label">保有ポイント</div>
    <div class="h-pt"><b class="num">${yen(bal)}</b><span>pt</span></div>
    <div class="h-foot"><span class="mono">${m.member_no}</span><span>${esc(m.name)} 様</span></div></section>`;
}

function rankRoute(rank){
  const idx = RULES.RANKS.findIndex(r => r[0] === rank.code);
  return `<div class="route" role="img" aria-label="直近1年の参加 ${rank.tours}回。現在 ${rank.name}">
    ${RULES.RANKS.map((r, i) => `<div class="stop ${i < idx ? "done" : i === idx ? "here" : ""}"><b>${r[1]}</b><span>${r[2] ? `${r[2]}回〜` : "入会時"}・${r[3]}倍</span></div>`).join("")}
  </div>`;
}

const views = {
  home(m){
    const rank = rankFor(m.id, today), bal = balance(m.id, today);
    const soonLimit = addDays(today, 90);
    const sched = expiringSchedule(m.id, today);
    const soon = sched.filter(([d]) => d <= soonLimit);
    const soonPts = soon.reduce((a,[,p]) => a + p, 0);
    const recent = db.txns.filter(t => t.member_id === m.id).sort((a,b) => b.id - a.id).slice(0, 4);
    const next = RULES.RANKS.find(r => r[2] > rank.tours);
    const up = db.bookings.filter(b => b.member_id === m.id && b.status === "booked")
      .map(b => ({b, t:getTour(b.tour_id)})).filter(x => x.t.depart_date >= today)
      .sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1)[0];
    let board = `<section class="card next"><h2>次のご参加予定</h2><p class="small muted">参加予定のツアーはありません。ご予約はツアー窓口・お電話で承ります。</p></section>`;
    if (up){
      const {b, t} = up, gain = estimateEarn(m, t, b.price - b.points_used).items.reduce((a,[,p]) => a + p, 0);
      const days = Math.round((parse(t.depart_date) - parse(today)) / 864e5);
      board = `<section class="card next" aria-labelledby="next-h"><h2 id="next-h">次のご参加予定</h2>
        <div class="tname">${esc(t.name)}</div>
        <dl><dt>出発日</dt><dd>${jp(t.depart_date)}（${weekday(t.depart_date)}）${days === 0 ? "・本日出発" : `・あと${days}日`}</dd>
          <dt>お支払い</dt><dd>${yen(b.price - b.points_used)}円</dd><dt>ポイント利用</dt><dd>${yen(b.points_used)}pt</dd><dt>付与予定</dt><dd class="plus">+${yen(gain)}pt</dd></dl>
      </section>`;
    }
    const chip = up ? `<div class="chip-next" role="note">次のツアーまで<b>${(d => d === 0 ? "本日出発" : `あと${d}日`)(Math.round((parse(up.t.depart_date) - parse(today)) / 864e5))}</b></div>` : "";
    return `
    <div class="page-title"><h1>こんにちは、${esc(m.name)} 様</h1></div>
    ${flashHtml()}
    <div class="grid two">
      <div>${hero(m, rank, bal)}<p class="hero-note">ツアー当日、受付でこの画面をお見せください</p>${chip}</div>
      <section class="card" aria-labelledby="bal-h">
        <h2 id="bal-h">ポイントの使い方と期限</h2>
        <p class="small muted">${yen(bal)}円分としてツアー代金に使えます（${RULES.REDEEM_UNIT}pt単位）</p>
        ${soonPts ? `<div class="notice"><b>${yen(soonPts)}pt</b> の有効期限が近づいています（${jp(soon[0][0])}まで）</div>` : ""}
        ${sched.length ? `<div class="small muted">有効期限ごとの内訳</div><table class="plain">${sched.slice(0, 3).map(([d,p]) => `<tr><th>${jp(d)}まで</th><td>${yen(p)}pt</td></tr>`).join("")}</table>` : `<p class="small muted">有効なポイントはありません。</p>`}
        ${sched.length > 3 ? `<button type="button" class="linkbtn" data-tab="info">有効期限をすべて見る</button>` : ""}
      </section>
    </div>
    <div class="grid two-even">
      <section class="card" aria-labelledby="rank-h">
        <h2 id="rank-h">会員ランク <span class="badge rank-${rank.code}">${esc(rank.name)}</span></h2>
        ${rankRoute(rank)}
        <p class="small">直近1年の参加 <b>${rank.tours}回</b>${next ? `。あと<b>${next[2] - rank.tours}回</b>で${next[1]}（${next[3]}倍）になります。` : "。最上位ランクです。"}</p>
      </section>
      ${board}
    </div>
    <section class="card"><h2>最近のポイント <button type="button" class="link" data-tab="history">履歴をすべて見る</button></h2>
      ${recent.length ? histTable(recent) : `<p class="muted small">まだありません。</p>`}</section>`;
  },

  history(m){
    const rows = db.txns.filter(t => t.member_id === m.id).sort((a,b) => b.id - a.id);
    const earned = rows.filter(r => r.points > 0).reduce((a,r) => a + r.points, 0);
    const used = rows.filter(r => r.kind === "redeem").reduce((a,r) => a - r.points, 0);
    return `<div class="page-title"><h1>ポイント履歴</h1></div>
    <div class="grid two" style="grid-template-columns:${innerWidth >= 960 ? "1.6fr .9fr" : "1fr"}">
      <section class="card">${rows.length ? histTable(rows) : `<p class="muted">ポイントの履歴はまだありません。</p>`}</section>
      <section class="card"><h2>これまでの合計</h2><dl class="kv"><dt>獲得したポイント</dt><dd>+${yen(earned)}pt</dd><dt>ツアー代金に使ったポイント</dt><dd>${yen(used)}pt</dd><dt>現在の保有ポイント</dt><dd><b>${yen(balance(m.id, today))}pt</b></dd></dl></section>
    </div>`;
  },

  tours(m){
    const all = db.bookings.filter(b => b.member_id === m.id).map(b => ({b, t:getTour(b.tour_id)}));
    const upcoming = all.filter(x => x.b.status === "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1);
    const past = all.filter(x => x.b.status !== "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? 1 : -1);
    const trip = ({b, t}) => {
      const earned = db.txns.filter(x => x.booking_id === b.id && (x.kind === "earn" || x.kind === "bonus")).reduce((a,x) => a + x.points, 0);
      const est = b.status === "booked" ? estimateEarn(m, t, b.price - b.points_used).items.reduce((a,[,p]) => a + p, 0) : 0;
      return `<div class="trip"><div class="top"><span class="badge st-${b.status}">${BOOKING[b.status]}</span><span>${jp(t.depart_date)}（${weekday(t.depart_date)}）出発</span></div>
        <div class="name">${esc(t.name)}</div>
        <div class="facts"><span>代金 ${yen(b.price)}円</span>${b.points_used ? `<span>ポイント利用 ${yen(b.points_used)}pt</span>` : ""}
          ${b.status === "completed" ? `<span class="plus">獲得 +${yen(earned)}pt</span>` : ""}${b.status === "booked" ? `<span class="plus">参加で +${yen(est)}pt の予定</span>` : ""}</div></div>`;
    };
    return `<div class="page-title"><h1>ツアー</h1></div>
    <div class="grid two-even">
      <section class="card"><h2>参加予定</h2>${upcoming.map(trip).join("") || `<p class="muted small">参加予定のツアーはありません。ご予約はツアー窓口・お電話で承ります。</p>`}</section>
      <section class="card"><h2>これまでのツアー</h2>${past.map(trip).join("") || `<p class="muted small">まだありません。</p>`}</section>
    </div>`;
  },

  info(m){
    const sched = expiringSchedule(m.id, today);
    return `<div class="page-title"><h1>ご案内</h1></div>
    ${flashHtml()}
    <div class="grid two-even">
      <section class="card"><h2>有効期限ごとのポイント</h2>${
        sched.length ? `<table class="plain">${sched.map(([d,p]) => `<tr><th>${jp(d)}まで</th><td>${yen(p)}pt</td></tr>`).join("")}</table>` : `<p class="muted small">有効なポイントはありません。</p>`}
        <p class="small muted">付与日から${RULES.EXPIRY_YEARS}年後の月末まで有効です。期限の近いものから使われます。</p></section>
      <section class="card"><h2>ポイントのため方</h2><ul class="how">
        <li>ツアー代金${RULES.YEN_PER_POINT}円ごとに1pt × ランク倍率（ツアー終了後に付与）</li>
        <li>お誕生月のツアー参加で +${RULES.BIRTHDAY_BONUS}pt</li>
        <li>ご紹介した方の初参加で +${RULES.REFERRAL_BONUS}pt</li>
        <li>キャンペーン対象ツアーはポイント増量</li></ul>
        <p class="small"><a href="../">ポイント制度のくわしいご案内</a></p></section>
      <section class="card"><h2>暗証番号の変更</h2><form class="stack" data-form="pin">
        <label class="field"><span>現在の暗証番号</span><input class="input" id="p-cur" name="current" type="password" inputmode="numeric" autocomplete="current-password" required></label>
        <label class="field"><span>新しい暗証番号</span><input class="input" id="p-new" name="next" type="password" inputmode="numeric" autocomplete="new-password" required><small>4〜8桁の数字</small></label>
        <div><button class="btn">変更する</button></div></form></section>
      <section class="card"><h2>会員情報</h2><dl class="kv"><dt>会員番号</dt><dd class="mono">${m.member_no}</dd><dt>入会日</dt><dd>${jp(m.joined_on)}</dd></dl>
        <p class="small muted">ご登録内容の変更・退会はツアー窓口で承ります。</p>
        <div><button type="button" class="btn ghost" data-act="logout">ログアウト</button></div></section>
    </div>`;
  },

  login(){
    const samples = db.members.filter(m => m.status === "active").slice(0, 3);
    return `<div class="login">
      <header class="appbar"><a class="brand" href="../">バスツアー会員</a></header>
      <main>
        <h1>会員ページ ログイン</h1>
        <p class="small">会員番号と暗証番号を入れると、保有ポイント、会員ランク、参加予定のツアーを確認できます。</p>
        ${flashHtml()}
        <section class="card">
          <form class="stack" data-form="login">
            <label class="field"><span>会員番号</span><input class="input mono" id="l-no" name="member_no" autocomplete="username" autocapitalize="characters" placeholder="例：BT00000018" required><small>会員証に記載されています</small></label>
            <label class="field"><span>暗証番号</span><input class="input" id="l-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
            <button class="btn block">ログイン</button>
          </form>
          <p class="small muted">暗証番号を忘れた方は、ツアー窓口で再設定いたします。</p></section>
        <section class="card"><h2>デモ用のサンプル会員</h2><p class="small muted">押すと会員番号と暗証番号が入ります。</p>
          <div class="samples">${samples.map(m => { const r = rankFor(m.id, today); return `<button type="button" data-fill="${m.member_no}" data-pin="${esc(m.pin)}">${esc(m.name)}<small>${r.name}・${yen(balance(m.id, today))}pt</small></button>`; }).join("")}</div></section>
        <p class="small muted"><a href="../admin/">スタッフ画面</a>で予約やポイント付与をすると、同じブラウザならこの画面に反映されます。</p>
      </main>
    </div>`;
  },
};

function render(){
  const m = current();
  if (!m){ ui.memberNo = null; remember(null); }
  if (!m){ root.innerHTML = views.login(); ui.flash = null; document.title = "ログイン｜バスツアー会員ページ"; return; }
  const navBtns = compact => TABS.map(([k,l]) => `<button type="button" class="navbtn" data-tab="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>${ICONS[k]}<span>${compact ? TAB_SHORT[k] : l}</span></button>`).join("");
  root.innerHTML = `<div class="app signed">
    <aside class="side" aria-label="メニュー">
      <a class="brand" href="../">バスツアー会員</a>
      <nav>${navBtns(false)}</nav>
      <div class="who"><span>ログイン中</span><b>${esc(m.name)} 様</b><span class="mono">${m.member_no}</span></div>
      <div class="links"><a href="../">制度のご案内</a><a href="../admin/">スタッフ画面（デモ）</a><button type="button" data-act="logout">ログアウト</button></div>
    </aside>
    <div class="content">
      <header class="appbar"><a class="brand" href="../">バスツアー会員</a><span class="demo" title="デモの日付">デモ ${slash(today)}</span></header>
      <main id="main">${views[ui.tab](m)}</main>
    </div>
  </div>
  <nav class="tabbar" aria-label="メニュー"><div class="tabs">${navBtns(true)}</div></nav>`;
  document.title = `${TABS.find(t => t[0] === ui.tab)[1]}｜バスツアー会員ページ`;
  ui.flash = null;
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const fill = e.target.closest("[data-fill]");
  if (fill){ document.getElementById("l-no").value = fill.dataset.fill; document.getElementById("l-pin").value = fill.dataset.pin; document.getElementById("l-pin").focus(); return; }
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "logout"){ ui.memberNo = null; remember(null); ui.tab = "home"; ui.flash = ["ok","ログアウトしました"]; render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "login"){
    const m = authenticate(v.member_no, v.pin);
    if (!m){ ui.flash = ["err","会員番号または暗証番号が正しくありません"]; render(); return; }
    ui.memberNo = m.member_no; remember(m.member_no); ui.tab = "home"; render();
  } else if (f.dataset.form === "pin"){
    const m = current();
    if (m.pin !== v.current) ui.flash = ["err","現在の暗証番号が正しくありません"];
    else if (!/^\d{4,8}$/.test(v.next || "")) ui.flash = ["err","暗証番号は4〜8桁の数字で設定してください"];
    else { m.pin = v.next; save(); ui.flash = ["ok","暗証番号を変更しました"]; }
    render();
  }
});

// スタッフ画面（別タブ）での変更をすぐ反映する
window.addEventListener("storage", e => { if (e.key === STORE_KEY){ bootData(); render(); } });
let lastWide = innerWidth >= 960;
window.addEventListener("resize", () => { const w = innerWidth >= 960; if (w !== lastWide){ lastWide = w; render(); } });

bootData();
ui.memberNo = recall();
render();
</script>
<script src="../assets/viewswitch.js" data-view="phone"></script>
</body>
</html>
