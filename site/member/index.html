<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f2b">
<title>バスツアー会員アプリ</title>
<style>
/* Layout: スマホ1画面幅（最大480px）の縦スクロール。上に小さなヘッダー、下に4つのタブバーを固定 */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --fg:#16231c; --muted:#5a6a61; --line:#dce5df;
  --accent:#1d6a44; --accent-ink:#ffffff; --accent-soft:#e2f0e7;
  --plus:#16803c; --minus:#b42318; --warn-bg:#fff3d1; --warn-fg:#6a4b00;
  --gold-bg:#f9e7a8; --gold-fg:#5e4500; --silver-bg:#e3e8ec; --silver-fg:#34404a;
  --card:#173f2b; --card-ink:#eaf5ee; --track:#d4e3d9;
  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --fg:#e3ece6; --muted:#98a99f; --line:#29352e;
  --accent:#5cc48a; --accent-ink:#08170e; --accent-soft:#1b3326;
  --plus:#5cc48a; --minus:#f08679; --warn-bg:#3d3112; --warn-fg:#f3d98a;
  --gold-bg:#4a3a0e; --gold-fg:#f6d67a; --silver-bg:#2a3238; --silver-fg:#d3dbe1;
  --card:#0f2b1c; --card-ink:#d9eee1; --track:#26372d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --fg:#e3ece6; --muted:#98a99f; --line:#29352e;
  --accent:#5cc48a; --accent-ink:#08170e; --accent-soft:#1b3326;
  --plus:#5cc48a; --minus:#f08679; --warn-bg:#3d3112; --warn-fg:#f3d98a;
  --gold-bg:#4a3a0e; --gold-fg:#f6d67a; --silver-bg:#2a3238; --silver-fg:#d3dbe1;
  --card:#0f2b1c; --card-ink:#d9eee1; --track:#26372d; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.shell{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.7rem 16px .5rem;display:flex;align-items:center;gap:.6rem}
.appbar h1{font-size:1.05rem;margin:0;margin-right:auto;text-wrap:balance}
.chip{font-size:.75rem;padding:.15rem .55rem;border-radius:99px;background:var(--warn-bg);color:var(--warn-fg);font-weight:600;white-space:nowrap}
main{flex:1;padding-inline:16px;padding-block:.2rem calc(var(--tabbar) + 1.5rem + env(safe-area-inset-bottom,0px));display:grid;gap:.9rem;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;min-width:0}
h2{font-size:1rem;margin:0 0 .6rem;text-wrap:balance}
p{margin:.25rem 0}
.muted{color:var(--muted);font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* 会員証：バスの乗車券をモチーフに、右端をミシン目で切り取った控えにする */
.ticket{width:100%;aspect-ratio:86/54;max-width:100%;border-radius:16px;background:var(--card);color:var(--card-ink);display:grid;grid-template-columns:1fr 27%;overflow:hidden;border:1px solid var(--line)}
.ticket .main{padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.ticket .stub{border-left:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;font-size:.7rem}
.ticket .label{font-size:.66rem;letter-spacing:.14em;opacity:.8}
.ticket .no{font-family:var(--font-num);font-size:clamp(1.15rem,6vw,1.55rem);letter-spacing:.12em;font-weight:700}
.ticket .name{font-weight:700}
.pill{display:inline-block;padding:.05rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--silver-bg);color:var(--silver-fg);white-space:nowrap}
.pill.regular{background:var(--accent-soft);color:var(--fg)}
.pill.gold{background:var(--gold-bg);color:var(--gold-fg)}
.ticket .stub .pill{font-size:.72rem;padding:.05rem .45rem}

.balance{display:flex;align-items:baseline;gap:.3rem}
.balance b{font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.balance span{color:var(--muted);font-weight:600}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:.55rem .75rem;font-size:.88rem}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.list{display:grid}
.item{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .title{min-width:0;overflow-wrap:anywhere}
.item .meta{grid-column:1;color:var(--muted);font-size:.8rem}
.item .pts{grid-row:1 / span 2;grid-column:2;align-self:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.month{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:.4rem 0 0}

.tour{display:grid;gap:.25rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.tour:last-child{border-bottom:0}
.tour .date{font-family:var(--font-num);font-size:.82rem;color:var(--muted)}
.tour .name{font-weight:700;overflow-wrap:anywhere}
.tour .facts{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.85rem}
.state{font-size:.72rem;font-weight:700;padding:.05rem .5rem;border-radius:99px;background:var(--silver-bg);color:var(--muted)}
.state.booked{background:var(--accent-soft);color:var(--fg)}
.state.completed{background:var(--accent-soft);color:var(--plus)}

table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:.4rem 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
ul{padding-left:1.15rem;margin:.2rem 0} li{margin:.25rem 0}

label{display:block;font-weight:600;font-size:.85rem;margin:.7rem 0 .25rem}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px}
button{font:inherit;font-weight:700;border:1px solid transparent;border-radius:12px;padding:.8rem 1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%;margin-top:1rem}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{border-radius:10px;padding:.6rem .8rem;font-size:.9rem;border:1px solid var(--line)}
.msg.ok{background:var(--accent-soft)} .msg.err{background:var(--warn-bg);color:var(--warn-fg)}
.samples{display:flex;flex-wrap:wrap;gap:.4rem}
.samples button{width:auto;margin:0;padding:.4rem .7rem;font-size:.82rem;background:var(--accent-soft);color:var(--fg)}
a{color:var(--accent);font-weight:600}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
.tabbar button{margin:0;width:auto;background:transparent;color:var(--muted);border:0;border-radius:0;padding:.35rem 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){main > *{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<div class="shell">
  <header class="appbar">
    <h1>バスツアー会員</h1>
    <span class="chip" id="demo-chip">デモ</span>
  </header>
  <main id="app"></main>
</div>
<div class="tabbar" id="tabbar" hidden>
  <nav aria-label="メニュー">
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M15 6v12"/><path d="M6 10h6M6 14h4"/></svg>会員証</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>履歴</button>
    <button type="button" data-tab="tours"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M3 11h18M7 17v3M17 17v3"/><circle cx="7.5" cy="14" r=".6"/><circle cx="16.5" cy="14" r=".6"/></svg>ツアー</button>
    <button type="button" data-tab="info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>ご案内</button>
  </nav>
</div>

<script src="../points.js"></script>
<script>
"use strict";
// 会員（旅行客）向けのスマホ画面。スタッフ画面と同じブラウザ内のデータを読む。
const SESSION_KEY = "bt-points-member-v1";
const app = document.getElementById("app");
const tabbar = document.getElementById("tabbar");
const ui = {tab:"home", memberNo:null, flash:null};

function remember(no){ try { no ? localStorage.setItem(SESSION_KEY, no) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function recall(){ try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } }

function current(){
  if (!ui.memberNo) return null;
  try { const m = getMember(ui.memberNo); return m.status === "active" ? m : null; } catch (e) { return null; }
}
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number); return `${y}年${m}月${d}日`; };
const flashHtml = () => ui.flash ? `<div class="msg ${ui.flash[0]}" role="status">${esc(ui.flash[1])}</div>` : "";

function ticket(m, rank){
  return `<div class="ticket" role="img" aria-label="会員証 ${m.member_no} ${esc(m.name)}様 ${rank.name}">
    <div class="main"><div class="label">BUS TOUR MEMBERS</div>
      <div class="no">${m.member_no}</div>
      <div><div class="name">${esc(m.name)} 様</div><div class="label">入会日 ${m.joined_on}</div></div></div>
    <div class="stub"><span>会員証</span><span class="pill ${rank.code}">${esc(rank.name)}</span></div></div>`;
}

const views = {
  login(){
    const samples = db.members.filter(m => m.status === "active").slice(0, 3);
    return `${flashHtml()}
    <section class="panel"><h2>ログイン</h2>
      <form data-form="login">
        <label for="l-no">会員番号</label><input id="l-no" name="member_no" autocomplete="username" autocapitalize="characters" placeholder="BT00000018" required>
        <label for="l-pin">暗証番号</label><input id="l-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button>ログイン</button></form>
      <p class="muted" style="margin-top:.8rem">会員番号は会員証に記載されています。暗証番号をお忘れの場合はツアー窓口へお問い合わせください。</p>
    </section>
    <section class="panel"><h2>デモ用のサンプル会員</h2>
      <p class="muted">押すと会員番号と暗証番号が入ります。</p>
      <div class="samples">${samples.map(m => `<button type="button" data-fill="${m.member_no}" data-pin="${esc(m.pin)}">${esc(m.name)}</button>`).join("")}</div>
    </section>
    <p class="muted">スタッフの操作画面は <a href="../">スタッフ画面（デモ）</a> で見られます。同じブラウザなら、そこで予約やポイント付与をすると、この画面に反映されます。</p>`;
  },

  home(m){
    const rank = rankFor(m.id, today), bal = balance(m.id, today);
    const soonLimit = addDays(today, 90);
    const soon = expiringSchedule(m.id, today).filter(([d]) => d <= soonLimit);
    const soonPts = soon.reduce((a,[,p]) => a + p, 0);
    const next = RULES.RANKS.find(r => r[2] > rank.tours);
    const pct = next ? Math.min(100, Math.round(rank.tours / next[2] * 100)) : 100;
    const upcoming = db.bookings.filter(b => b.member_id === m.id && b.status === "booked")
      .map(b => ({b, t:getTour(b.tour_id)})).filter(x => x.t.depart_date >= today)
      .sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1)[0];
    let nextTour = `<p class="muted">参加予定のツアーはありません。</p>`;
    if (upcoming){
      const {b, t} = upcoming, e = estimateEarn(m, t, b.price - b.points_used);
      nextTour = `<div class="tour" style="padding:0"><div class="date">${fmtDate(t.depart_date)} 出発</div><div class="name">${esc(t.name)}</div>
        <div class="facts"><span>お支払い ${yen(b.price - b.points_used)}円</span>${b.points_used ? `<span>ポイント利用 ${yen(b.points_used)}pt</span>` : ""}
        <span class="plus">参加で約 ${yen(e.items.reduce((a,[,p]) => a + p, 0))}pt</span></div></div>`;
    }
    return `${flashHtml()}
    ${ticket(m, rank)}
    <p class="muted" style="text-align:center;margin-top:-.3rem">ツアー当日、受付でこの画面をお見せください</p>
    <section class="panel">
      <div class="muted">保有ポイント</div>
      <div class="balance"><b>${yen(bal)}</b><span>pt</span></div>
      <p class="muted">1pt＝1円として、${RULES.REDEEM_UNIT}pt単位でツアー代金に使えます</p>
      ${soonPts ? `<div class="notice" style="margin-top:.6rem">${yen(soonPts)}pt の有効期限が近づいています（${soon[0][0].replace(/-/g,"/")} まで）</div>` : ""}
    </section>
    <section class="panel"><h2>会員ランク <span class="pill ${rank.code}">${esc(rank.name)}</span></h2>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${next ? next[2] : rank.tours}" aria-valuenow="${rank.tours}"><i style="width:${pct}%"></i></div>
      <p>直近1年の参加 <b>${rank.tours}回</b>${next ? `・あと${next[2] - rank.tours}回で<b>${next[1]}</b>（ポイント×${next[3]}）` : "・最上位ランクです"}</p>
      <p class="muted">今のランクではツアー代金100円ごとに ${rank.multiplier}pt たまります</p>
    </section>
    <section class="panel"><h2>次のツアー</h2>${nextTour}</section>`;
  },

  history(m){
    const rows = db.txns.filter(t => t.member_id === m.id).sort((a,b) => b.id - a.id);
    if (!rows.length) return `<section class="panel"><p class="muted">ポイントの履歴はまだありません。</p></section>`;
    let html = "", month = "";
    for (const r of rows){
      const mo = r.created_on.slice(0,7);
      if (mo !== month){ if (month) html += `</div>`; month = mo; html += `<div class="month">${mo.replace("-","年")}月</div><div class="list">`; }
      const b = r.booking_id && db.bookings.find(x => x.id === r.booking_id);
      const tn = b ? getTour(b.tour_id).name : "";
      const title = (r.kind === "earn" || r.kind === "bonus") && tn && !r.reason.includes(tn) ? `${r.reason}／${tn}` : r.reason;
      html += `<div class="item"><div class="title">${esc(title)}</div><div class="meta">${r.created_on.replace(/-/g,"/")}・${KIND[r.kind]}</div>
        <div class="pts ${r.points > 0 ? "plus" : "minus"}">${r.points > 0 ? "+" : ""}${yen(r.points)}</div></div>`;
    }
    return `<section class="panel"><h2>ポイント履歴</h2>${html}</div></section>`;
  },

  tours(m){
    const all = db.bookings.filter(b => b.member_id === m.id).map(b => ({b, t:getTour(b.tour_id)}));
    const upcoming = all.filter(x => x.b.status === "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? -1 : 1);
    const past = all.filter(x => x.b.status !== "booked").sort((x,y) => x.t.depart_date < y.t.depart_date ? 1 : -1);
    const card = ({b, t}) => {
      const earned = db.txns.filter(x => x.booking_id === b.id && (x.kind === "earn" || x.kind === "bonus")).reduce((a,x) => a + x.points, 0);
      const est = b.status === "booked" ? estimateEarn(m, t, b.price - b.points_used).items.reduce((a,[,p]) => a + p, 0) : 0;
      return `<div class="tour"><div class="date">${fmtDate(t.depart_date)} <span class="state ${b.status}">${BOOKING[b.status]}</span></div>
        <div class="name">${esc(t.name)}</div>
        <div class="facts"><span>代金 ${yen(b.price)}円</span>${b.points_used ? `<span>利用 ${yen(b.points_used)}pt</span>` : ""}
        ${b.status === "completed" ? `<span class="plus">獲得 +${yen(earned)}pt</span>` : ""}${b.status === "booked" ? `<span class="plus">参加で約 ${yen(est)}pt</span>` : ""}</div></div>`;
    };
    return `<section class="panel"><h2>参加予定</h2>${upcoming.map(card).join("") || `<p class="muted">参加予定のツアーはありません。ご予約はツアー窓口・お電話で承ります。</p>`}</section>
      <section class="panel"><h2>これまでのツアー</h2>${past.map(card).join("") || `<p class="muted">まだありません。</p>`}</section>`;
  },

  info(m){
    const sched = expiringSchedule(m.id, today);
    return `${flashHtml()}
    <section class="panel"><h2>有効期限ごとのポイント</h2>${
      sched.length ? `<table>${sched.map(([d,p]) => `<tr><td>${d.replace(/-/g,"/")} まで</td><td>${yen(p)}pt</td></tr>`).join("")}</table>` : `<p class="muted">有効なポイントはありません。</p>`}
      <p class="muted">ポイントは付与日から${RULES.EXPIRY_YEARS}年後の月末まで有効です。期限の近いものから使われます。</p></section>
    <section class="panel"><h2>ポイントのため方</h2><ul>
      <li>ツアー代金${RULES.YEN_PER_POINT}円ごとに1pt × ランク倍率（ツアー終了後に付与）</li>
      <li>お誕生月のツアー参加で +${RULES.BIRTHDAY_BONUS}pt</li>
      <li>ご紹介した方の初参加で +${RULES.REFERRAL_BONUS}pt</li>
      <li>キャンペーン対象ツアーはポイント増量</li></ul>
      <h2 style="margin-top:.8rem">ランク</h2><ul>${RULES.RANKS.map(([c,n,need,mult]) => `<li><span class="pill ${c}">${n}</span> ${need ? `直近1年で${need}回以上参加` : "ご入会時"}・×${mult}</li>`).join("")}</ul></section>
    <section class="panel"><h2>暗証番号の変更</h2><form data-form="pin">
      <label for="p-cur">現在の暗証番号</label><input id="p-cur" name="current" type="password" inputmode="numeric" autocomplete="current-password" required>
      <label for="p-new">新しい暗証番号（4〜8桁の数字）</label><input id="p-new" name="next" type="password" inputmode="numeric" autocomplete="new-password" required>
      <button>変更する</button></form></section>
    <section class="panel"><p>会員番号 <span class="num">${m.member_no}</span></p>
      <p class="muted">ご登録内容の変更・退会はツアー窓口で承ります。</p>
      <button type="button" class="ghost" data-act="logout">ログアウト</button></section>
    <p class="muted">デモ版：データはこのブラウザの中だけに保存されています。<a href="../">スタッフ画面（デモ）</a></p>`;
  },
};

function render(){
  const m = current();
  if (!m){ ui.memberNo = null; remember(null); }
  document.getElementById("demo-chip").textContent = `デモ ${today.replace(/-/g,"/")}`;
  tabbar.hidden = !m;
  document.querySelectorAll("[data-tab]").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  app.innerHTML = m ? views[ui.tab](m) : views.login();
  ui.flash = null;
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const fill = e.target.closest("[data-fill]");
  if (fill){ document.getElementById("l-no").value = fill.dataset.fill; document.getElementById("l-pin").value = fill.dataset.pin; return; }
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "logout"){ ui.memberNo = null; remember(null); ui.tab = "home"; ui.flash = ["ok","ログアウトしました"]; render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "login"){
    const m = authenticate(v.member_no, v.pin);
    if (!m){ ui.flash = ["err","会員番号または暗証番号が正しくありません"]; render(); return; }
    ui.memberNo = m.member_no; remember(m.member_no); ui.tab = "home"; render();
  } else if (f.dataset.form === "pin"){
    const m = current();
    if (m.pin !== v.current) ui.flash = ["err","現在の暗証番号が正しくありません"];
    else if (!/^\d{4,8}$/.test(v.next || "")) ui.flash = ["err","暗証番号は4〜8桁の数字で設定してください"];
    else { m.pin = v.next; save(); ui.flash = ["ok","暗証番号を変更しました"]; }
    render();
  }
});

// スタッフ画面（別タブ）での変更をすぐ反映する
window.addEventListener("storage", e => { if (e.key === STORE_KEY){ bootData(); render(); } });

bootData();
ui.memberNo = recall();
render();
</script>
</body>
</html>
